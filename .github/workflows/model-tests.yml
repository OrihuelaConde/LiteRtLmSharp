name: Model tests

# Runs the model-backed interop tests with a real .litertlm model — the path the regular CI job
# skips (no LITERTLM_TEST_MODEL). Matrix over linux-x64 / win-x64 / osx-arm64 (choose via the
# platforms input, like build-native.yml; ci.yml calls it with all platforms, a manual run can pick
# a single OS). Scenarios per OS:
# blocking chat, streaming, tool calling without constrained decoding, tool calling WITH
# constrained decoding, a speculative-decoding A/B benchmark (decode tok/s, drafter off vs on), and
# multimodal image/audio attachments (gemma-4-E2B-it is text+vision+audio; the gated tests assert the
# attachment adds encoder tokens) — the constrained-decoding one on linux-x64 currently asserts the temporary guard throws (the
# upstream prebuilt constraint provider returns broken constraints, LiteRT-LM#2149 root-caused
# 2026-06-12; when Google ships a fixed prebuilt and the guard is removed, that test flips to
# the real end-to-end loop) and on win-x64/osx-arm64 runs the real constrained loop.
# osx-arm64 (macos-15 = Apple Silicon) validates the macOS natives on CPU and GPU; the GPU pass
# runs WebGPU (Dawn->Metal), not the native Metal delegate — see that step's comment for why.
# Reusable (called by ci.yml on each push/PR for all platforms) + on demand for a single OS; the
# ~2.6 GB model is cached between runs (repo cache, 10 GB limit, free for public repos — no account
# storage/billing impact) and shared across OSes via enableCrossOsArchive so the legs reuse one blob.
#
# Model choice: gemma-4-E2B-it (litert-community, ungated) — deliberately NOT a smaller one:
#  - the small Gemma .litertlm repos (gemma-3-270m-it, Gemma3-1B-IT, functiongemma-*) are
#    gated on Hugging Face (license acceptance + token), which this job avoids needing;
#  - Qwen3-0.6B is ungated but its chat template rejects the tools injection ("tried to use
#    + operator on unsupported types map and string" → send_message returns null), so it
#    cannot exercise the tool-calling path. Both verified 2026-06-12.

on:
  # Reusable: ci.yml calls this on every push/PR with platforms=all for per-commit model validation
  # across linux/win/macOS. Also runnable on demand to test a single OS.
  workflow_call:
    inputs:
      platforms:
        description: 'Platforms to test (comma-separated: linux-x64,win-x64,osx-arm64) or "all"'
        type: string
        required: false
        default: 'all'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to test (comma-separated: linux-x64,win-x64,osx-arm64) or "all"'
        required: true
        default: 'all'

env:
  # Keep in sync with Directory.Build.props <LiteRtLmVersion>.
  NATIVE_REF: v0.14.0
  MODEL_FILE: gemma-4-E2B-it.litertlm
  MODEL_URL: https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm
  # LFS oid of the file on Hugging Face; also guards against a cached/partial download.
  MODEL_SHA256: 181938105e0eefd105961417e8da75903eacda102c4fce9ce90f50b97139a63c

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Filter platform matrix
        id: filter
        shell: bash
        env:
          # Empty on schedule runs → defaults to all.
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          linux='{"os":"ubuntu-latest","rid":"linux-x64","asset":"litertlm-linux_x86_64.tar.gz"}'
          win='{"os":"windows-latest","rid":"win-x64","asset":"litertlm-windows_x86_64.tar.gz"}'
          mac='{"os":"macos-15","rid":"osx-arm64","asset":"litertlm-macos_arm64.tar.gz"}'
          [ "$PLATFORMS" = "all" ] && PLATFORMS="linux-x64,win-x64,osx-arm64"
          entries=""
          IFS=',' read -ra rids <<< "$PLATFORMS"
          for rid in "${rids[@]}"; do
            rid="${rid// /}"
            case "$rid" in
              linux-x64) entry="$linux" ;;
              win-x64)   entry="$win" ;;
              osx-arm64) entry="$mac" ;;
              "")        continue ;;
              *) echo "::error::Unknown platform '$rid' (valid: linux-x64,win-x64,osx-arm64 or all)"; exit 1 ;;
            esac
            entries="${entries:+$entries,}$entry"
          done
          if [ -z "$entries" ]; then
            echo "::error::No platforms selected from '$PLATFORMS'"
            exit 1
          fi
          echo "matrix=[$entries]" >> "$GITHUB_OUTPUT"
          echo "Testing: [$entries]"

  model-test:
    needs: prepare
    strategy:
      fail-fast: false # a broken OS must not cancel the other legs
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Crash forensics (2026-07-17: one intermittent testhost crash in the overflow-guard test on
    # win-x64; the VSTest blame dump carried no exception context, so the NTSTATUS is unknown):
    # have the CLR write its own minidump on a fatal crash — createdump includes the exception
    # stream. Type 1 (Mini) on purpose: a heap dump would embed the ~2.6 GB model. diag/ is
    # uploaded with the test results.
    env:
      DOTNET_DbgEnableMiniDump: '1'
      DOTNET_DbgMiniDumpType: '1'
      DOTNET_DbgMiniDumpName: ${{ github.workspace }}/diag/createdump-%p.dmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Sample available memory / test-process working set / disk every 5 s for the whole job
      # (covers model download + build + tests) so a recurrence of the overflow-guard crash can be correlated
      # with runner resource pressure. Summarized and uploaded by the teardown step below.
      - name: Start resource sampler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diag | Out-Null
          $p = Start-Process pwsh -ArgumentList '-NoProfile','-File','scripts/ci/sample-resources.ps1','-OutFile','diag/resources.csv' -PassThru
          $p.Id | Set-Content diag/sampler.pid
          Write-Host "Sampler running (pid $($p.Id))"

      # Fail-fast terminations (e.g. heap corruption 0xC0000374) bypass the CLR's unhandled-
      # exception path, so createdump never fires for them — WER LocalDumps catches those.
      - name: Enable WER crash dumps (win)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'diag/wer'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\testhost.exe'
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty $key DumpFolder $dir
          Set-ItemProperty $key DumpType 1
          Set-ItemProperty $key DumpCount 3

      - name: Restore native binaries (${{ matrix.rid }})
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "runtimes/${{ matrix.rid }}/native"
          # Retry: the releases API occasionally throws transient 401/5xx (seen 2026-06-10).
          for attempt in 1 2 3; do
            gh release download "native-${NATIVE_REF}" \
              --repo "${{ github.repository }}" \
              --pattern '${{ matrix.asset }}' \
              --dir . && break
            echo "download attempt $attempt failed; retrying in 20s..."
            [ "$attempt" = "3" ] && exit 1
            sleep 20
          done
          tar -xzf '${{ matrix.asset }}' -C "runtimes/${{ matrix.rid }}/native"
          ls "runtimes/${{ matrix.rid }}/native"

      - name: Cache model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/${{ env.MODEL_FILE }}
          key: litertlm-model-${{ env.MODEL_SHA256 }}
          # One 2.6 GB blob shared by all three OS legs instead of 3x within the 10 GB limit.
          enableCrossOsArchive: true

      - name: Download model
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p models
          curl -fL --retry 3 --retry-delay 15 -o "models/$MODEL_FILE" "$MODEL_URL"

      # sha256sum: Git Bash ships it on Windows; GitHub's macOS images include coreutils.
      - name: Verify model checksum
        shell: bash
        run: echo "$MODEL_SHA256  models/$MODEL_FILE" | sha256sum -c -

      - name: Build
        run: dotnet build LiteRtLmSharp.slnx -c Release

      # --blame-crash turns a native SIGSEGV that kills the test host into a failed run with a
      # sequence file + minidump instead of a silent green/cancelled job; --blame-hang aborts a
      # decode that never returns (the other failure mode reported in LiteRT-LM#2149).
      # LITERTLM_TEST_BENCH=1 also runs the speculative-decoding A/B benchmark (loads the model
      # twice — drafter off vs on — and reports decode tok/s via the native benchmark API). The
      # gemma-4-E2B-it model ships an MTP drafter, so the speedup is measured here; the printed
      # Markdown row lands in this step's console log and feeds docs/speculative-decoding.md.
      - name: Test with model (CPU — streaming + tools + speculative benchmark + multimodal)
        timeout-minutes: 30
        shell: bash
        env:
          LITERTLM_TEST_MODEL: ${{ github.workspace }}/models/${{ env.MODEL_FILE }}
          LITERTLM_TEST_TOOLS: '1'
          LITERTLM_TEST_BENCH: '1'
          # gemma-4-E2B-it is text+vision+audio: run the gated multimodal model tests. They load their
          # own engine (vision/audio backend on) and assert the image/audio attachment adds encoder
          # tokens (deterministic ingestion proof). Validated locally on win-x64 CPU (2026-06-17);
          # this is the first linux-x64/osx-arm64 CPU check. GPU multimodal stays unvalidated for now.
          LITERTLM_TEST_VISION: '1'
        run: |
          dotnet test LiteRtLmSharp.Tests/LiteRtLmSharp.Tests.csproj -c Release --no-build \
            --logger "console;verbosity=normal" \
            --blame-crash --blame-crash-dump-type mini \
            --blame-hang --blame-hang-dump-type mini --blame-hang-timeout 15m \
            --results-directory TestResults
          # Echo the speculative-decoding A/B row (the test appends it to the step summary) into the
          # log too: the console logger swallows ITestOutputHelper output for passing tests at normal
          # verbosity, so this is the only place the measured tok/s land in the retrievable log.
          echo "::group::Speculative decoding A/B (step summary)"
          cat "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo "::endgroup::"

      # GPU pass on the macos-15 runner. Its GPU is Apple's paravirtual Metal device
      # (Virtualization.framework), on which the NATIVE Metal delegate garbles output — but the
      # WebGPU delegate (Dawn->Metal) is correct, and upstream gpu_registry prefers WebGpu over
      # Metal on macOS desktop, so with both shipped (build-native.yml) the engine runs WebGPU
      # here. Root-caused with Google's own CLI on the runner (see docs/roadmap.md) and confirmed 6/6 below,
      # so this is a REQUIRED check now, not experimental. Real Apple Silicon (where the native
      # Metal delegate also works, per flutter_gemma) is still unvalidated by us — see roadmap.
      - name: Test with model (GPU — WebGPU/Metal — incl. multimodal on GPU)
        if: matrix.rid == 'osx-arm64'
        timeout-minutes: 20
        shell: bash
        env:
          LITERTLM_TEST_MODEL: ${{ github.workspace }}/models/${{ env.MODEL_FILE }}
          LITERTLM_TEST_TOOLS: '1'
          LITERTLM_TEST_BACKEND: gpu
          # Run the multimodal tests on GPU too. Vision runs on GPU; the audio test probes audio on the
          # GPU backend (WebGPU→Metal on macOS) — it fails on win-x64 but win is not a GPU leg here, so
          # this determines whether macOS supports audio-on-GPU (the audio test skips, not fails, if not).
          LITERTLM_TEST_VISION: '1'
        run: |
          dotnet test LiteRtLmSharp.Tests/LiteRtLmSharp.Tests.csproj -c Release --no-build \
            --logger "console;verbosity=normal" \
            --blame-crash --blame-crash-dump-type mini \
            --blame-hang --blame-hang-dump-type mini --blame-hang-timeout 10m \
            --results-directory TestResults-gpu

      - name: Stop sampler and summarize resources
        if: always()
        shell: pwsh
        run: |
          if (Test-Path diag/sampler.pid) {
            try { Stop-Process -Id (Get-Content diag/sampler.pid) -Force -ErrorAction Stop } catch {}
            Remove-Item diag/sampler.pid
          }
          if (Test-Path diag/resources.csv) {
            $rows = Import-Csv diag/resources.csv
            if ($rows) {
              $min = ($rows | ForEach-Object { [int]$_.availMemMB } | Measure-Object -Minimum).Minimum
              Write-Host "Resource samples: $($rows.Count); minimum available memory: $min MB"
              Write-Host '--- last 10 samples ---'
              $rows | Select-Object -Last 10 | Format-Table -AutoSize | Out-String | Write-Host
            }
          }

      - name: Upload test results and crash/hang dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-test-results-${{ matrix.rid }}
          path: |
            TestResults
            TestResults-gpu
            diag
          if-no-files-found: ignore
          # Crash/hang dumps can reach ~750 MB; free on public repos but keep retention short.
          retention-days: 7
