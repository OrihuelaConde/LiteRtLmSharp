name: Pack NuGet packages

# Builds the NuGet packages: the managed LiteRtLmSharp (pure) + per-RID native runtime packages
# (LiteRtLmSharp.runtime.win-x64 / .linux-x64). Native binaries are pulled from the GitHub Release
# produced by build-native.yml (tag native-<native_ref>), so run that first.
#
# Run manually from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: 'NuGet package version (independent of the native ref). Empty = Version in Directory.Build.props.'
        required: false
        default: ''
      native_ref:
        description: 'LiteRT-LM ref whose native release to consume (release tag = native-<ref>). Empty = LiteRtLmVersion in Directory.Build.props.'
        required: false
        default: ''
      push:
        description: 'Push packages to nuget.org (via Trusted Publishing — OIDC, no secret needed)'
        type: boolean
        default: false

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC token for nuget.org Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve versions
        # Inputs if given, else the single source of truth in Directory.Build.props.
        run: |
          set -euo pipefail
          pkg="${{ inputs.package_version }}"
          ref="${{ inputs.native_ref }}"
          [ -n "$pkg" ] || pkg=$(grep -oE '<Version>[^<]+' Directory.Build.props | head -1 | sed 's/<Version>//')
          [ -n "$ref" ] || ref=$(grep -oE '<LiteRtLmVersion>[^<]+' Directory.Build.props | sed 's/<LiteRtLmVersion>//')
          echo "package_version=$pkg / native_ref=$ref"
          echo "PKG_VERSION=$pkg" >> "$GITHUB_ENV"
          echo "NATIVE_REF=$ref" >> "$GITHUB_ENV"

      - name: Download native binaries from release native-${{ env.NATIVE_REF }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p natives
          gh release download "native-${NATIVE_REF}" \
            --repo "${{ github.repository }}" \
            --pattern 'litertlm-*.tar.gz' \
            --dir natives
          ls -lh natives/

      - name: Lay out runtimes/<rid>/native
        run: |
          # asset name -> rid dir
          declare -A map=(
            [litertlm-windows_x86_64.tar.gz]=win-x64
            [litertlm-linux_x86_64.tar.gz]=linux-x64
            [litertlm-android_arm64.tar.gz]=android-arm64
            [litertlm-macos_arm64.tar.gz]=osx-arm64
          )
          for asset in "${!map[@]}"; do
            rid="${map[$asset]}"
            mkdir -p "runtimes/$rid/native"
            if [ -f "natives/$asset" ]; then
              tar -xzf "natives/$asset" -C "runtimes/$rid/native"
              # strip macOS AppleDouble files if any
              find "runtimes/$rid/native" -name '._*' -delete
              echo "$rid:"; ls "runtimes/$rid/native"
            else
              echo "$rid: no asset ($asset) — its runtime package will be skipped"
            fi
          done

          # iOS is special: it ships .xcframeworks (not a runtimes/<rid>/native dlopen layout),
          # so extract at the rid ROOT — the tar carries an xcframeworks/ dir at its top level.
          if [ -f "natives/litertlm-ios_arm64.tar.gz" ]; then
            mkdir -p "runtimes/ios-arm64"
            tar -xzf "natives/litertlm-ios_arm64.tar.gz" -C "runtimes/ios-arm64"
            find "runtimes/ios-arm64" -name '._*' -delete
            rm -f "runtimes/ios-arm64"/*.dylib   # the tar also carries the raw dylibs; the package only ships the xcframeworks
            echo "ios-arm64:"; ls -R "runtimes/ios-arm64/xcframeworks" 2>/dev/null || echo "  (no xcframeworks/)"
          else
            echo "ios-arm64: no asset — its runtime package will be skipped"
          fi

      - name: Pack
        run: |
          common="-c Release -o artifacts -p:Version=${PKG_VERSION} -p:LiteRtLmVersion=${NATIVE_REF} -p:ContinuousIntegrationBuild=true"
          dotnet pack LiteRtLmSharp/LiteRtLmSharp.csproj $common
          for rid in win-x64 linux-x64 android-arm64 osx-arm64; do
            if [ -n "$(ls runtimes/$rid/native 2>/dev/null)" ]; then
              dotnet pack "packaging/LiteRtLmSharp.runtime.$rid/LiteRtLmSharp.runtime.$rid.csproj" $common
            else
              echo "skip LiteRtLmSharp.runtime.$rid (no natives)"
            fi
          done
          # iOS: packs the .xcframeworks restored above (netstandard2.0 project, no Mac needed to pack).
          if [ -n "$(ls runtimes/ios-arm64/xcframeworks 2>/dev/null)" ]; then
            dotnet pack "packaging/LiteRtLmSharp.runtime.ios-arm64/LiteRtLmSharp.runtime.ios-arm64.csproj" $common
          else
            echo "skip LiteRtLmSharp.runtime.ios-arm64 (no xcframeworks)"
          fi
          ls -lh artifacts/*.nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs-${{ env.PKG_VERSION }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      # Trusted Publishing: exchange the GitHub OIDC token for a 1-hour nuget.org API key
      # (policy configured on nuget.org under the OrihuelaConde account for this workflow file).
      - name: NuGet login (OIDC -> temp API key)
        if: inputs.push
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: OrihuelaConde

      - name: Push to nuget.org
        if: inputs.push
        run: |
          dotnet nuget push 'artifacts/*.nupkg' --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
