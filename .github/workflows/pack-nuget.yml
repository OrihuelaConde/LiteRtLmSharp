name: Pack NuGet packages

# Builds the NuGet packages: the managed LiteRtLmSharp (pure) + per-RID native runtime packages
# (LiteRtLmSharp.runtime.win-x64 / .linux-x64). Native binaries are pulled from the GitHub Release
# produced by build-native.yml (tag native-<native_ref>), so run that first.
#
# Run manually from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: 'NuGet package version (e.g. 0.1.0-preview.1; independent of the native ref)'
        required: true
        default: '0.1.0-preview.1'
      native_ref:
        description: 'LiteRT-LM ref whose native release to consume (release tag = native-<ref>)'
        required: true
        default: 'v0.13.1'
      push:
        description: 'Push packages to nuget.org (requires NUGET_API_KEY secret)'
        type: boolean
        default: false

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download native binaries from release native-${{ inputs.native_ref }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p natives
          gh release download "native-${{ inputs.native_ref }}" \
            --repo "${{ github.repository }}" \
            --pattern 'litertlm-*.tar.gz' \
            --dir natives
          ls -lh natives/

      - name: Lay out runtimes/<rid>/native
        run: |
          # asset name -> rid dir
          declare -A map=(
            [litertlm-windows_x86_64.tar.gz]=win-x64
            [litertlm-linux_x86_64.tar.gz]=linux-x64
            [litertlm-android_arm64.tar.gz]=android-arm64
            [litertlm-macos_arm64.tar.gz]=osx-arm64
          )
          for asset in "${!map[@]}"; do
            rid="${map[$asset]}"
            mkdir -p "runtimes/$rid/native"
            if [ -f "natives/$asset" ]; then
              tar -xzf "natives/$asset" -C "runtimes/$rid/native"
              # strip macOS AppleDouble files if any
              find "runtimes/$rid/native" -name '._*' -delete
              echo "$rid:"; ls "runtimes/$rid/native"
            else
              echo "$rid: no asset ($asset) — its runtime package will be skipped"
            fi
          done

      - name: Pack
        run: |
          common="-c Release -o artifacts -p:Version=${{ inputs.package_version }} -p:LiteRtLmVersion=${{ inputs.native_ref }} -p:ContinuousIntegrationBuild=true"
          dotnet pack LiteRtLmSharp/LiteRtLmSharp.csproj $common
          for rid in win-x64 linux-x64 android-arm64 osx-arm64; do
            if [ -n "$(ls runtimes/$rid/native 2>/dev/null)" ]; then
              dotnet pack "packaging/LiteRtLmSharp.runtime.$rid/LiteRtLmSharp.runtime.$rid.csproj" $common
            else
              echo "skip LiteRtLmSharp.runtime.$rid (no natives)"
            fi
          done
          ls -lh artifacts/*.nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs-${{ inputs.package_version }}
          path: artifacts/*.nupkg

      - name: Push to nuget.org
        if: inputs.push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then echo "NUGET_API_KEY secret not set"; exit 1; fi
          dotnet nuget push 'artifacts/*.nupkg' --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
