name: Pack NuGet packages

# Builds the NuGet packages: the managed LiteRtLmSharp (pure) + per-RID native runtime packages
# (LiteRtLmSharp.runtime.win-x64 / .linux-x64 / ...). Native binaries are pulled from the GitHub Release
# published by native-release.yml (tag native-<native_ref>, Google's official prebuilts), so run that first.
#
# Structure: pack -> consumer-smoke -> publish. The smoke consumes the just-packed nupkgs from a
# local feed on windows-latest like a real framework-dependent app (real generation on CPU through
# all three package layers, plus a GPU accelerator LOAD-PATH assertion that needs no physical GPU)
# and gates the publish job — a package whose native layout is broken never reaches nuget.org.
#
# Run manually from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: 'NuGet package version (independent of the native ref). Empty = Version in Directory.Build.props.'
        required: false
        default: ''
      native_ref:
        description: 'LiteRT-LM ref whose native release to consume (release tag = native-<ref>). Empty = LiteRtLmVersion in Directory.Build.props.'
        required: false
        default: ''
      push:
        description: 'Push packages to nuget.org (via Trusted Publishing — OIDC, no secret needed)'
        type: boolean
        default: false
      include_ios:
        description: 'Also pack LiteRtLmSharp.runtime.ios-arm64. Keep OFF until the package is validated on a real device (build/link CI only so far — see the roadmap iOS phase).'
        type: boolean
        default: false

env:
  MODEL_FILE: gemma-4-E2B-it.litertlm
  MODEL_URL: https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm
  # LFS oid of the file on Hugging Face; also guards against a cached/partial download. Same
  # values as model-tests.yml so both workflows share one model cache entry.
  MODEL_SHA256: 181938105e0eefd105961417e8da75903eacda102c4fce9ce90f50b97139a63c

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.versions.outputs.package_version }}
      native_ref: ${{ steps.versions.outputs.native_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve versions
        id: versions
        # Inputs if given, else the single source of truth in Directory.Build.props.
        run: |
          set -euo pipefail
          pkg="${{ inputs.package_version }}"
          ref="${{ inputs.native_ref }}"
          [ -n "$pkg" ] || pkg=$(grep -oE '<Version>[^<]+' Directory.Build.props | head -1 | sed 's/<Version>//')
          [ -n "$ref" ] || ref=$(grep -oE '<LiteRtLmVersion>[^<]+' Directory.Build.props | sed 's/<LiteRtLmVersion>//')
          echo "package_version=$pkg / native_ref=$ref"
          echo "PKG_VERSION=$pkg" >> "$GITHUB_ENV"
          echo "NATIVE_REF=$ref" >> "$GITHUB_ENV"
          echo "package_version=$pkg" >> "$GITHUB_OUTPUT"
          echo "native_ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Download native binaries from release native-${{ env.NATIVE_REF }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p natives
          gh release download "native-${NATIVE_REF}" \
            --repo "${{ github.repository }}" \
            --pattern 'litertlm-*.tar.gz' \
            --pattern 'THIRD_PARTY_NOTICES.litert-lm.txt' \
            --dir natives
          ls -lh natives/
          # Upstream's notice file for the official binaries ships inside every runtime package; a
          # release without it is not something we publish from.
          [ -f natives/THIRD_PARTY_NOTICES.litert-lm.txt ] \
            || { echo "::error::native-${NATIVE_REF} has no THIRD_PARTY_NOTICES.litert-lm.txt asset (re-run native-release.yml with publish_release)"; exit 1; }
          mkdir -p runtimes && cp natives/THIRD_PARTY_NOTICES.litert-lm.txt runtimes/

      - name: Lay out runtimes/<rid>/native
        run: |
          # asset name -> rid dir
          declare -A map=(
            [litertlm-windows_x86_64.tar.gz]=win-x64
            [litertlm-linux_x86_64.tar.gz]=linux-x64
            [litertlm-android_arm64.tar.gz]=android-arm64
            [litertlm-macos_arm64.tar.gz]=osx-arm64
          )
          for asset in "${!map[@]}"; do
            rid="${map[$asset]}"
            mkdir -p "runtimes/$rid/native"
            if [ -f "natives/$asset" ]; then
              tar -xzf "natives/$asset" -C "runtimes/$rid/native"
              # strip macOS AppleDouble files if any
              find "runtimes/$rid/native" -name '._*' -delete
              echo "$rid:"; ls "runtimes/$rid/native"
            else
              echo "$rid: no asset ($asset) — its runtime package will be skipped"
            fi
          done

          # iOS is special twice over: it ships .xcframeworks (not a runtimes/<rid>/native dlopen
          # layout), so extract at the rid ROOT — and it is gated behind include_ios because the
          # package is not device-validated yet (packing it with push=true would publish it).
          if [ "${{ inputs.include_ios }}" = "true" ] && [ -f "natives/litertlm-ios_arm64.tar.gz" ]; then
            mkdir -p "runtimes/ios-arm64"
            tar -xzf "natives/litertlm-ios_arm64.tar.gz" -C "runtimes/ios-arm64"
            find "runtimes/ios-arm64" -name '._*' -delete
            echo "ios-arm64:"; ls -R "runtimes/ios-arm64/xcframeworks" 2>/dev/null || echo "  (no xcframeworks/)"
          else
            echo "ios-arm64: skipped (include_ios=${{ inputs.include_ios }}; not packed until device-validated)"
          fi

      - name: Pack
        run: |
          common="-c Release -o artifacts -p:Version=${PKG_VERSION} -p:LiteRtLmVersion=${NATIVE_REF} -p:ContinuousIntegrationBuild=true"
          dotnet pack LiteRtLmSharp/LiteRtLmSharp.csproj $common
          # Microsoft.Extensions.AI (IChatClient) integration: pure managed, no natives. Depends on the
          # LiteRtLmSharp package (same version) + Microsoft.Extensions.AI.Abstractions. This is the
          # foundation the Semantic Kernel connector builds on.
          dotnet pack LiteRtLmSharp.Extensions.AI/LiteRtLmSharp.Extensions.AI.csproj $common
          # Semantic Kernel connector: pure managed, no natives. Depends on the LiteRtLmSharp +
          # LiteRtLmSharp.Extensions.AI packages (same version) + Microsoft.SemanticKernel.Abstractions.
          dotnet pack LiteRtLmSharp.SemanticKernel/LiteRtLmSharp.SemanticKernel.csproj $common
          for rid in win-x64 linux-x64 android-arm64 osx-arm64; do
            if [ -n "$(ls runtimes/$rid/native 2>/dev/null)" ]; then
              dotnet pack "packaging/LiteRtLmSharp.runtime.$rid/LiteRtLmSharp.runtime.$rid.csproj" $common
            else
              echo "skip LiteRtLmSharp.runtime.$rid (no natives)"
            fi
          done
          # iOS: packs the .xcframeworks restored above (netstandard2.0 project, no Mac needed to
          # pack). Only reachable with include_ios=true — see the input description.
          if [ -n "$(ls runtimes/ios-arm64/xcframeworks 2>/dev/null)" ]; then
            dotnet pack "packaging/LiteRtLmSharp.runtime.ios-arm64/LiteRtLmSharp.runtime.ios-arm64.csproj" $common
          else
            echo "skip LiteRtLmSharp.runtime.ios-arm64 (include_ios off or no xcframeworks)"
          fi
          ls -lh artifacts/*.nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs-${{ env.PKG_VERSION }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  # Consumes the just-packed packages from a local feed like a real framework-dependent app —
  # i.e. through the NuGet runtimes/<rid>/native layout, which the repo's own test suite never
  # exercises (it runs against a flat dev copy of the natives). Two kinds of assertion:
  #  - CPU legs (raw / IChatClient / Semantic Kernel): real generation through each package layer.
  #  - GPU leg: the runner has no GPU, so the assertion is the accelerator LOAD PATH, not
  #    generation: with Backend=Gpu the engine must at least emit WebGPU/Dawn init lines on
  #    stderr (the accelerator DLLs were found and loaded). Zero lines + failure is the exact
  #    signature of the 1.1.1 bug class — accelerators unreachable in the NuGet layout — which a
  #    CPU-only smoke can never catch. If Dawn finds a usable adapter (e.g. D3D12 WARP), the leg
  #    passes outright on exit 0.
  consumer-smoke:
    needs: pack
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PKG_VERSION: ${{ needs.pack.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: nupkgs-${{ env.PKG_VERSION }}
          path: feed

      - name: Cache model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/${{ env.MODEL_FILE }}
          key: litertlm-model-${{ env.MODEL_SHA256 }}

      - name: Download model
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p models
          curl -fL --retry 3 --retry-delay 15 -o "models/$MODEL_FILE" "$MODEL_URL"

      - name: Verify model checksum
        shell: bash
        run: echo "$MODEL_SHA256  models/$MODEL_FILE" | sha256sum -c -

      - name: Build smoke app against the packed feed
        run: dotnet build .github/consumer-smoke -c Release -p:LiteRtLmSharpVersion=${{ env.PKG_VERSION }}

      - name: 'CPU legs: raw + IChatClient + Semantic Kernel (real generation)'
        shell: pwsh
        run: |
          $exe = '.github/consumer-smoke/bin/Release/net10.0/ConsumerSmoke.exe'
          $model = "models/$env:MODEL_FILE"
          foreach ($mode in 'raw','meai','sk') {
            & $exe $model cpu $mode
            if ($LASTEXITCODE -ne 0) { throw "CPU/$mode leg failed (exit $LASTEXITCODE)" }
          }

      - name: 'GPU leg: accelerator load path'
        shell: pwsh
        run: |
          $exe = '.github/consumer-smoke/bin/Release/net10.0/ConsumerSmoke.exe'
          $model = "models/$env:MODEL_FILE"
          & $exe $model gpu raw 2> gpu-stderr.txt
          $code = $LASTEXITCODE
          Get-Content gpu-stderr.txt
          $dawn = (Select-String -Path gpu-stderr.txt -Pattern 'dawn|WebGPU' -AllMatches | Measure-Object).Count
          Write-Host "gpu exit=$code, WebGPU/Dawn stderr lines=$dawn"
          if ($code -eq 0) {
            Write-Host 'GPU leg: FULL pass — a usable adapter exists on this runner (WARP or hardware) and generation succeeded.'
          } elseif ($dawn -gt 0) {
            Write-Host 'GPU leg: LOAD-PATH pass — the accelerator libraries were found and initialized; the engine then failed for lack of a usable GPU, which is expected on this runner.'
          } else {
            throw 'GPU leg FAILED: zero WebGPU/Dawn stderr lines — the GPU accelerator libraries never loaded from the NuGet layout (the exact bug class the 1.1.1 fix addresses).'
          }
          # GitHub's pwsh shell appends `exit $LASTEXITCODE`, which would resurface the exe's
          # expected non-zero exit after a load-path pass — end with an explicit success.
          exit 0

  publish:
    needs: [pack, consumer-smoke]
    if: inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the v<version> tag + GitHub release
      id-token: write  # OIDC token for nuget.org Trusted Publishing
    env:
      PKG_VERSION: ${{ needs.pack.outputs.package_version }}
      NATIVE_REF: ${{ needs.pack.outputs.native_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: nupkgs-${{ env.PKG_VERSION }}
          path: artifacts

      # The GitHub release body is this version's CHANGELOG section, so the notes are readable on the
      # release page itself. Runs BEFORE the NuGet push on purpose: a missing section fails the run
      # while nothing has been published yet (NuGet versions are immutable).
      - name: Prepare release notes from CHANGELOG
        run: |
          awk -v ver="${PKG_VERSION}" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [${PKG_VERSION}]' section — add one before publishing."
            exit 1
          fi
          {
            echo "Published on [nuget.org](https://www.nuget.org/packages/LiteRtLmSharp/${PKG_VERSION}); the same .nupkg files are attached below. Native binaries: LiteRT-LM ${NATIVE_REF}."
            cat release-notes.md
          } > release-body.md
          echo "release body: $(wc -l < release-body.md) lines"

      # Belt-and-braces with the changelog check above: the CHANGELOG-section validation passes even
      # when PKG_VERSION was already shipped (its section is still there), so also fail if the v<version>
      # tag already exists. Runs BEFORE the NuGet push, because publishing an already-shipped version is a
      # no-op at best (versions are immutable) and would fail the later tag/release step after the push.
      - name: Fail if tag v${{ env.PKG_VERSION }} already exists
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v${PKG_VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${PKG_VERSION} already exists; that version already shipped (NuGet versions are immutable). Bump <Version> in Directory.Build.props before publishing."
            exit 1
          fi
          echo "Tag v${PKG_VERSION} does not exist yet; OK to publish."

      # Trusted Publishing: exchange the GitHub OIDC token for a 1-hour nuget.org API key
      # (policy configured on nuget.org under the OrihuelaConde account for this workflow file).
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: OrihuelaConde

      - name: Push to nuget.org
        run: |
          dotnet nuget push 'artifacts/*.nupkg' --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

      # A real publish also tags the commit and opens a GitHub release carrying the same .nupkg files
      # pushed to nuget.org (an auditable mirror; nuget.org stays the canonical source). Runs after the
      # NuGet push so a failed push never leaves a tagged release without packages.
      - name: Tag and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${PKG_VERSION}" artifacts/*.nupkg artifacts/*.snupkg \
            --repo "${{ github.repository }}" \
            --target "${GITHUB_SHA}" \
            --title "v${PKG_VERSION}" \
            --notes-file release-body.md
