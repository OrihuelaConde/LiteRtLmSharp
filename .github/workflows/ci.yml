name: CI

# Build + tests on Linux and Windows. Restores the native binaries from the native-<ref> release
# so the interop tests actually load LiteRtLm (this is also how we validate the linux-x64 runtime).
# Model/tools tests auto-skip here (no LITERTLM_TEST_MODEL).

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  # Keep in sync with Directory.Build.props <LiteRtLmVersion>.
  NATIVE_REF: v0.13.1

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            asset: litertlm-linux_x86_64.tar.gz
          - os: windows-latest
            rid: win-x64
            asset: litertlm-windows_x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore native binaries (${{ matrix.rid }})
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "runtimes/${{ matrix.rid }}/native"
          gh release download "native-${NATIVE_REF}" \
            --repo "${{ github.repository }}" \
            --pattern '${{ matrix.asset }}' \
            --dir .
          tar -xzf '${{ matrix.asset }}' -C "runtimes/${{ matrix.rid }}/native"
          ls "runtimes/${{ matrix.rid }}/native"

      # Build projects directly instead of the solution: LiteLMSharp.slnx includes the MAUI
      # sample, which needs MAUI workloads the hosted runners don't have (and installing them
      # would burn minutes). Tests transitively build the library.
      - name: Build
        run: |
          dotnet build LiteLMSharp.Tests/LiteLMSharp.Tests.csproj -c Release
          dotnet build samples/Console/LiteLMSharp.Sample.csproj -c Release

      - name: Test (interop tests load the native lib; model tests auto-skip)
        run: dotnet test LiteLMSharp.Tests/LiteLMSharp.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
