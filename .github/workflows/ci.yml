name: CI

# Build + no-model tests (the interop tests load the native lib, so this also validates the runtimes;
# model/tools tests auto-skip without LITERTLM_TEST_MODEL) AND the model-backed tests against a real
# model, both across linux-x64 / win-x64 / osx-arm64. The model leg reuses model-tests.yml, which also
# stays runnable on demand for a single OS.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels an in-progress run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with Directory.Build.props <LiteRtLmVersion>.
  NATIVE_REF: v0.13.1

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            asset: litertlm-linux_x86_64.tar.gz
          - os: windows-latest
            rid: win-x64
            asset: litertlm-windows_x86_64.tar.gz
          - os: macos-15
            rid: osx-arm64
            asset: litertlm-macos_arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore native binaries (${{ matrix.rid }})
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "runtimes/${{ matrix.rid }}/native"
          # Retry: the releases API occasionally throws transient 401/5xx (seen 2026-06-10).
          for attempt in 1 2 3; do
            gh release download "native-${NATIVE_REF}" \
              --repo "${{ github.repository }}" \
              --pattern '${{ matrix.asset }}' \
              --dir . && break
            echo "download attempt $attempt failed; retrying in 20s..."
            [ "$attempt" = "3" ] && exit 1
            sleep 20
          done
          tar -xzf '${{ matrix.asset }}' -C "runtimes/${{ matrix.rid }}/native"
          ls "runtimes/${{ matrix.rid }}/native"

      # Main solution (lib + tests + packaging) builds with the bare SDK. Samples live in
      # samples/LiteRtLmSharp.Samples.slnx; only the console one is built here (the MAUI sample
      # needs MAUI workloads the hosted runners don't have).
      - name: Build
        run: |
          dotnet build LiteRtLmSharp.slnx -c Release
          dotnet build samples/Console/LiteRtLmSharp.Sample.csproj -c Release
          # The Semantic Kernel sample builds with the bare SDK too (no MAUI workloads needed).
          dotnet build samples/SemanticKernel/LiteRtLmSharp.Sample.SemanticKernel.csproj -c Release

      - name: Test (interop tests load the native lib; model tests auto-skip)
        run: dotnet test LiteRtLmSharp.Tests/LiteRtLmSharp.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

  # Model-backed tests against a real .litertlm model across all three OSes (linux/win/macOS CPU, plus
  # macOS GPU). Reuses model-tests.yml, which also stays runnable on demand for a single OS. Runs in
  # parallel with build-test; the ~2.6 GB model is cached across runs.
  model-tests:
    name: Model tests
    uses: ./.github/workflows/model-tests.yml
    permissions:
      contents: read
    with:
      platforms: all
