name: Build LiteRT-LM native libraries

# Builds our own libLiteRtLm.so (linux-x64) and LiteRtLm.dll (win-x64) from a
# pinned LiteRT-LM ref, using native/patch_c_api.sh to add the shared-lib target
# (upstream has none yet — issue #2154). Accelerator companions are pulled from
# the repo's prebuilt/<platform>/ via git-lfs. Optionally publishes them as a
# GitHub Release (tag native-<ref>) on THIS repo, which scripts/restore-natives.ps1
# can then consume instead of the community prebuilt.
#
# Pinning header + binary to the same ref eliminates the ABI skew we hit with the
# community 0.12.0-a binary (conversation_config crash, missing get_token_count).
#
# Run manually from the Actions tab (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      litertlm_version:
        description: 'LiteRT-LM ref (tag, branch, or commit SHA).'
        required: true
        # Release tag: version-synced with Google, includes get_token_count, and is the
        # target for streaming-fix validation. Proven fallback commit if a tag regresses:
        # 032334d81ff96431492be272e536fbafe094b1e9
        default: 'v0.14.0'
      platforms:
        description: 'Platforms to build (comma-separated: linux-x64,win-x64,android-arm64,macos-arm64,ios-arm64) or "all". Build only NEW platforms to save Actions minutes; the release keeps existing assets.'
        required: true
        default: 'all'
      publish_release:
        description: 'Publish artifacts to a GitHub Release on this repo'
        type: boolean
        default: false

jobs:
  build-linux-x64:
    name: linux-x64
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'linux-x64')
    # glibc 2.35 baseline for broad compatibility (Ubuntu 22.04+ / Debian 12+ / RHEL 9+).
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-17 (XNNPACK AVX-VNNI requires clang >= 15)
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 17
          sudo ln -sf /usr/bin/clang-17 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-17 /usr/bin/clang++
          clang --version

      - name: Clone LiteRT-LM @ ${{ env.LITERTLM_VERSION }}
        run: |
          git clone https://github.com/google-ai-edge/LiteRT-LM /tmp/LiteRT-LM
          cd /tmp/LiteRT-LM
          git checkout "$LITERTLM_VERSION"
          git lfs pull --include="prebuilt/linux_x86_64/*"

      - name: Patch C API (add shared-lib target)
        run: bash native/patch_c_api.sh /tmp/LiteRT-LM

      - name: Build libLiteRtLm.so
        # litert_runtime_link_mode=dynamic is REQUIRED alongside litert_link_capi_so since the
        # v0.14.0 @litert pin: without it the LiteRT runtime silently static-links INTO
        # libLiteRtLm even with litert_link_capi_so=true, producing TWO runtimes in-process
        # (the embedded one + the shipped libLiteRt the samplers import) — mixed GPU state and
        # an access violation in the WebGPU delegate on Windows. The define trio mirrors
        # upstream's own dynamic-linking CI jobs (ci-build*.yml at v0.14.0).
        run: |
          cd /tmp/LiteRT-LM
          bazelisk build -c opt --strip=always \
            --define=litert_link_capi_so=true \
            --define=litert_runtime_link_mode=dynamic \
            --define=resolve_symbols_in_exec=false \
            //c:libLiteRtLm.dylib

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp /tmp/LiteRT-LM/bazel-bin/c/libLiteRtLm.dylib artifacts/libLiteRtLm.so
          cp /tmp/LiteRT-LM/prebuilt/linux_x86_64/*.so artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: litertlm-linux_x86_64
          path: artifacts/

  build-windows-x64:
    name: win-x64
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'win-x64')
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
      ANDROID_NDK_HOME: ''
      BAZEL_OUTPUT_BASE: 'D:\b'   # short path: Bazel + Windows long-path limits
    steps:
      - uses: actions/checkout@v4

      - name: Configure git for long paths + symlinks
        run: |
          git config --global core.symlinks true
          git config --system core.longpaths true

      - name: Clone LiteRT-LM @ ${{ env.LITERTLM_VERSION }}
        run: |
          git clone https://github.com/google-ai-edge/LiteRT-LM C:\LiteRT-LM
          cd C:\LiteRT-LM
          git checkout "$env:LITERTLM_VERSION"
          git lfs pull --include="prebuilt/windows_x86_64/*"

      - name: Patch C API (add shared-lib target)
        shell: bash
        run: bash native/patch_c_api.sh C:/LiteRT-LM

      - name: Build LiteRtLm.dll
        # resolve_symbols_in_exec=false is required on Windows — without it Bazel
        # cannot resolve LiteRt* imports at link time (unresolved externals).
        # litert_runtime_link_mode=dynamic is REQUIRED since the v0.14.0 @litert pin —
        # without it the LiteRT runtime static-links into LiteRtLm.dll while the TopK
        # samplers import the separate libLiteRt.dll: two runtimes in one process and a
        # 0xC0000005 in the WebGPU delegate at engine_create (root-caused 2026-07-10).
        run: |
          cd C:\LiteRT-LM
          bazel --output_base="$env:BAZEL_OUTPUT_BASE" `
            build -c opt `
            --linkopt=/OPT:REF --linkopt=/OPT:ICF `
            --build_tag_filters='-nowindows' `
            --features=compiler_param_file `
            --features=archive_param_file `
            --spawn_strategy=local `
            --define=litert_link_capi_so=true `
            --define=litert_runtime_link_mode=dynamic `
            --define=resolve_symbols_in_exec=false `
            //c:libLiteRtLm.dylib

      - name: Download DirectXShaderCompiler runtime (WebGPU/DX12 GPU)
        run: |
          $dxcUrl = 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602/dxc_2026_02_20.zip'
          Invoke-WebRequest -Uri $dxcUrl -OutFile dxc.zip
          Expand-Archive -Path dxc.zip -DestinationPath dxc -Force

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item C:\LiteRT-LM\bazel-bin\c\libLiteRtLm.dylib artifacts\LiteRtLm.dll

          $prebuilt = 'C:\LiteRT-LM\prebuilt\windows_x86_64'
          # Copy every prebuilt DLL as-is (satisfies LiteRtLm.dll's PE imports,
          # which reference the original lib*-prefixed names). Only the lib*-prefixed
          # names are shipped: PE import-table + strings analysis (2026-07-18) shows both
          # the static imports and every runtime LoadLibrary in the binaries reference the
          # lib* names exclusively, and the managed resolver only probes LiteRtLm.dll —
          # the prefixless copies this step used to add were ~26 MB of dead weight.
          # DXC runtime (x64).
          foreach ($dxc in 'dxil.dll','dxcompiler.dll') {
            $src = Get-ChildItem -Recurse -Filter $dxc -Path dxc | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
            if (-not $src) { $src = Get-ChildItem -Recurse -Filter $dxc -Path dxc | Select-Object -First 1 }
            if (-not $src) { throw "DXC runtime missing: $dxc" }
            Copy-Item $src.FullName "artifacts\$dxc" -Force
          }
          Get-ChildItem artifacts\ | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: litertlm-windows_x86_64
          path: artifacts/

  build-android-arm64:
    name: android-arm64
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'android-arm64')
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android NDK
        # The runner ships an NDK; LiteRT-LM wants r28b+. If the default is too old the
        # Bazel step will say so — pin a newer NDK here (e.g. nttld/setup-ndk) if needed.
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          echo "Using NDK at ${ANDROID_NDK_LATEST_HOME}"
          ls "${ANDROID_NDK_LATEST_HOME}/source.properties" && cat "${ANDROID_NDK_LATEST_HOME}/source.properties" || true

      - name: Clone LiteRT-LM @ ${{ env.LITERTLM_VERSION }}
        run: |
          git clone https://github.com/google-ai-edge/LiteRT-LM /tmp/LiteRT-LM
          cd /tmp/LiteRT-LM
          git checkout "$LITERTLM_VERSION"
          git lfs pull --include="prebuilt/android_arm64/*"

      - name: Patch C API (add shared-lib target)
        run: bash native/patch_c_api.sh /tmp/LiteRT-LM

      - name: Build libLiteRtLm.so (android-arm64)
        # No litert_link_capi_so: Android has no separate libLiteRt.so in prebuilt/, so the
        # LiteRt C API is static-linked into libLiteRtLm.so (exported via the dynamic-list).
        # max-page-size=16384 satisfies Google Play's 16 KB page-size requirement.
        run: |
          cd /tmp/LiteRT-LM
          bazelisk build -c opt --strip=always \
            --config=android_arm64 \
            --linkopt=-Wl,-z,max-page-size=16384 \
            //c:libLiteRtLm.dylib

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp /tmp/LiteRT-LM/bazel-bin/c/libLiteRtLm.dylib artifacts/libLiteRtLm.so
          cp /tmp/LiteRT-LM/prebuilt/android_arm64/*.so artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Patch GPU samplers (add DT_NEEDED libLiteRtLm.so)
        # Google's prebuilt TopK samplers reference LiteRt* symbols but ship without a
        # DT_NEEDED on libLiteRtLm.so, so their dlopen fails ("cannot locate symbol
        # LiteRtCreateEnvironment") and sampling falls back to CPU (upstream LiteRT-LM#2211;
        # same fix flutter_gemma ships since 0.15.1). Note: bionic ignores
        # RTLD_NOLOAD|RTLD_GLOBAL flag promotion, so a consumer-side fix is not possible.
        # Known caveat from #2211: a few devices (e.g. Tensor G2) reject patchelf-modified
        # ELFs — the failure mode there is the same graceful CPU-sampling fallback as today.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q patchelf
          for f in artifacts/libLiteRtTopKOpenClSampler.so artifacts/libLiteRtTopKWebGpuSampler.so; do
            if [ -f "$f" ]; then
              patchelf --add-needed libLiteRtLm.so "$f"
              echo "$f NEEDED:"; patchelf --print-needed "$f"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: litertlm-android_arm64
          path: artifacts/

  build-macos-arm64:
    name: macos-arm64
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'macos-arm64')
    # NOTE: macOS runners bill at a 10x minutes multiplier on private repos — build this
    # platform alone (platforms=macos-arm64) and avoid rebuilding the others.
    runs-on: macos-15
    timeout-minutes: 120
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone LiteRT-LM @ ${{ env.LITERTLM_VERSION }}
        run: |
          git clone https://github.com/google-ai-edge/LiteRT-LM /tmp/LiteRT-LM
          cd /tmp/LiteRT-LM
          git checkout "$LITERTLM_VERSION"
          git lfs pull --include="prebuilt/macos_arm64/*"

      - name: Patch C API (add shared-lib target)
        run: bash native/patch_c_api.sh /tmp/LiteRT-LM

      - name: Build libLiteRtLm.dylib (macos-arm64)
        # Like linux-x64: LiteRt stays a SEPARATE shared lib (litert_link_capi_so) so the
        # prebuilt Metal sampler — which carries LC_LOAD_DYLIB @rpath/libLiteRt.dylib — can
        # load it at runtime (static linking made its dlopen fail and sampling fall back to
        # CPU). resolve_symbols_in_exec=false is REQUIRED with it on macOS: the repo
        # .bazelrc defaults that define to true, and with both set the upstream
        # @litert//litert/c:litert_runtime_c_api_shared_lib srcs select() has two matching
        # conditions (:resolve_symbols_in_exec and :macos) -> "illegal ambiguous match".
        # Google's own CI-Mac dylib pass uses this exact define pair. The patch adds
        # -rpath @loader_path so companion dylibs resolve from the same directory.
        # litert_runtime_link_mode=dynamic added for the v0.14.0 @litert pin (see the linux/
        # windows build steps). On macOS the static-embed failure mode was MASKED in CI: the
        # WebGPU accelerator resolves LiteRt* via dlsym against our exported wildcard symbols,
        # so it happened to bind the embedded copy — but the Metal sampler loads
        # @rpath/libLiteRt.dylib by install name and would hit the two-runtime mismatch on
        # real Apple Silicon hardware. Dynamic mode keeps every companion on ONE runtime.
        run: |
          cd /tmp/LiteRT-LM
          bazelisk build -c opt --strip=always \
            --define=litert_link_capi_so=true \
            --define=litert_runtime_link_mode=dynamic \
            --define=resolve_symbols_in_exec=false \
            //c:libLiteRtLm.dylib

      - name: Collect artifacts
        # Ship Google's COMPLETE macos_arm64 prebuilt GPU set — both the Metal pair AND the
        # WebGPU pair (+ the generic accelerator stub) — not Metal only. Why: on GitHub's
        # paravirtual Metal runner the native Metal delegate garbles output regardless of the
        # sampler, while WebGPU (Dawn->Metal) is correct and ~3x faster — verified with Google's
        # OWN litert_lm_main CLI on the runner (see docs/roadmap.md; 4 passes: WebGPU clean on cpu+gpu;
        # Metal compute garbled with the Metal sampler AND with CPU sampling). Upstream
        # gpu_registry's desktop load order is WebGpu -> OpenCL -> Metal, so with both present
        # the engine runs WebGPU and falls back to Metal only if WebGPU fails to load (e.g. a
        # real Apple Silicon Mac, still untested by us). This also matches upstream's macOS
        # default (LiteRT-LM PR #2302). Since v0.14.0 Dawn ships as a SEPARATE
        # libwebgpu_dawn.dylib in the prebuilt (statically embedded in the accelerator before
        # that) — the *.dylib glob below picks it up. libLiteRt.dylib stays a separate shared
        # lib (litert_link_capi_so + litert_runtime_link_mode=dynamic) so every
        # companion resolves it via @rpath/@loader_path; NativeLibraryResolver additionally
        # RTLD_GLOBAL-preloads the whole directory. (Reverts the WebGPU exclusion from a461607,
        # which was inherited from flutter_gemma's macOS bundle — but flutter_gemma runs on real
        # hardware where Metal works; our CI runner does not.)
        run: |
          mkdir -p artifacts
          cp /tmp/LiteRT-LM/bazel-bin/c/libLiteRtLm.dylib artifacts/libLiteRtLm.dylib
          cp /tmp/LiteRT-LM/prebuilt/macos_arm64/*.dylib artifacts/
          ls -lh artifacts/
          echo "--- exported litert_lm_* symbols ---"
          nm -gU artifacts/libLiteRtLm.dylib | grep -c litert_lm_ || true
          echo "--- load commands (expect @rpath/libLiteRt.dylib deps) ---"
          otool -L artifacts/libLiteRtLm.dylib
          otool -L artifacts/libLiteRtWebGpuAccelerator.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: litertlm-macos_arm64
          path: artifacts/

  build-ios-arm64:
    name: ios-arm64
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'ios-arm64')
    # NOTE: macOS runners bill at 10x on private repos — run platform-filtered.
    runs-on: macos-15
    timeout-minutes: 120
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone LiteRT-LM @ ${{ env.LITERTLM_VERSION }}
        run: |
          git clone https://github.com/google-ai-edge/LiteRT-LM /tmp/LiteRT-LM
          cd /tmp/LiteRT-LM
          git checkout "$LITERTLM_VERSION"
          git lfs pull --include="prebuilt/ios_arm64/*"

      - name: Patch C API (add shared-lib target)
        run: bash native/patch_c_api.sh /tmp/LiteRT-LM

      - name: Build libLiteRtLm.dylib (ios-arm64, device)
        # LiteRt STATIC-linked — deliberately NOT the macOS dynamic recipe, for two
        # verified reasons (2026-06-12):
        # 1. It isn't needed: unlike the macOS prebuilt, Google's iOS
        #    libLiteRtTopKMetalSampler.dylib has NO @rpath/libLiteRt.dylib load command —
        #    all 166 of its LiteRt* imports use DYNAMIC_LOOKUP (ordinal 254, flat
        #    namespace), and the static libLiteRtLm.dylib exports every one of them
        #    (166/166 coverage), so the sampler resolves against us at dlopen.
        # 2. It doesn't build: with litert_link_capi_so=true the pinned @litert routes
        #    iOS through a macos_dylib copy_file; that rule's macOS transition pulls
        #    XNNPACK SSE microkernels into the ios config, where -mstackrealign clashes
        #    with build:ios --copt=-fembed-bitcode (run 27436848074).
        # LiteRt*/litert_lm_* stay exported via -exported_symbol wildcards.
        # --config=ios_arm64 sets ios_minimum_os=13.0.
        run: |
          cd /tmp/LiteRT-LM
          bazelisk build -c opt --strip=always \
            --config=ios_arm64 \
            //c:libLiteRtLm.dylib

      - name: Collect artifacts
        # Companion set mirrors prebuilt/ios_arm64 minus libLiteRt.dylib (LiteRt is static
        # inside the main dylib; the iOS prebuilt companions don't reference
        # @rpath/libLiteRt.dylib — see build-step comment). Google ships
        # libGemmaModelConstraintProvider with minos 26.2 — apps targeting older iOS fail
        # to embed it. Same fix flutter_gemma uses (#245): vtool the minos down to 16.0
        # (keeping the sdk version) and re-sign ad-hoc (vtool invalidates the signature;
        # the app build re-signs everything anyway).
        run: |
          mkdir -p artifacts
          cp /tmp/LiteRT-LM/bazel-bin/c/libLiteRtLm.dylib artifacts/libLiteRtLm.dylib
          for lib in libGemmaModelConstraintProvider libLiteRtMetalAccelerator libLiteRtTopKMetalSampler; do
            cp "/tmp/LiteRT-LM/prebuilt/ios_arm64/${lib}.dylib" artifacts/ 2>/dev/null || echo "missing ${lib}"
          done

          chmod +w artifacts/*.dylib
          for f in artifacts/*.dylib; do
            minos=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{v=1} v && /minos/{print $2; exit}')
            sdk=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{v=1} v && /sdk/{print $2; exit}')
            if [ "$(printf '%s\n' "16.1" "$minos" | sort -V | head -1)" = "16.1" ]; then
              echo "patching $f: minos $minos -> 16.0 (sdk $sdk)"
              vtool -set-build-version ios 16.0 "$sdk" -replace -output "$f" "$f"
              codesign --force --sign - "$f"
            fi
          done

          ls -lh artifacts/
          echo "--- exported litert_lm_* symbols (C-API export surface) ---"
          cnt=$(nm -gU artifacts/libLiteRtLm.dylib | grep -c litert_lm_ || true)
          echo "exported litert_lm_* symbols: $cnt"
          if [ "$cnt" -lt 60 ]; then
            echo "ERROR: expected >=60 exported litert_lm_* symbols in libLiteRtLm.dylib, got $cnt"
            exit 1
          fi
          echo "--- iOS sampler contract: every LiteRt* the sampler imports must be exported by libLiteRtLm ---"
          # The iOS TopK Metal sampler resolves its LiteRt* imports via DYNAMIC_LOOKUP (flat namespace)
          # against libLiteRtLm at dlopen. Assert that import set is fully covered by our exports.
          missing=$(comm -23 \
            <(nm -u artifacts/libLiteRtTopKMetalSampler.dylib | awk '{print $NF}' | grep -E '^_LiteRt' | sort -u) \
            <(nm -gU artifacts/libLiteRtLm.dylib | awk '{print $NF}' | grep -E '^_LiteRt' | sort -u))
          if [ -n "$missing" ]; then
            echo "ERROR: the iOS sampler imports LiteRt* symbols NOT exported by libLiteRtLm.dylib:"
            echo "$missing"
            exit 1
          fi
          echo "OK: all sampler LiteRt* imports are covered by libLiteRtLm.dylib exports."
          echo "--- libLiteRtLm.dylib load commands (no @rpath/libLiteRt.dylib: static) ---"
          otool -L artifacts/libLiteRtLm.dylib
          echo "--- platform/min-OS of each dylib (post-patch) ---"
          for f in artifacts/*.dylib; do
            echo "== $f"
            otool -l "$f" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | head -8
          done

      - name: Wrap natives as dynamic frameworks + xcframeworks
        # iOS consumes the natives as embedded dynamic .frameworks (NativeReference Kind=Framework,
        # see docs/roadmap.md "Architecture decisions"). Wrap each libX.dylib as X.framework (flat
        # iOS layout: binary + Info.plist), set its framework install_name, ad-hoc codesign, then
        # xcodebuild -create-xcframework. The net10.0-ios app build embeds + re-signs them.
        # Device-arm64 only (no simulator slice upstream).
        #
        # RUNTIME / HARDWARE-PHASE TODO (does NOT affect build/link or this CI): the engine's
        # internal dlopen of the Metal accelerator/sampler must be pointed at the framework layout
        # (@executable_path/Frameworks/<X>.framework/<X>) for on-device execution — mirror
        # flutter_gemma's gpu_registry.cc/sampler_factory.cc patch (their patch_c_api.sh §10b,
        # ITMS-90432). Deferred to the device-validation phase; left unpatched here on purpose.
        run: |
          set -euo pipefail
          cd artifacts
          mkdir -p xcframeworks
          for dylib in libLiteRtLm.dylib libGemmaModelConstraintProvider.dylib libLiteRtMetalAccelerator.dylib libLiteRtTopKMetalSampler.dylib; do
            [ -f "$dylib" ] || { echo "missing $dylib, skipping"; continue; }
            name="${dylib#lib}"; name="${name%.dylib}"   # libLiteRtLm.dylib -> LiteRtLm
            fw="${name}.framework"
            rm -rf "$fw" "xcframeworks/${name}.xcframework"
            mkdir -p "$fw"
            cp "$dylib" "$fw/${name}"
            install_name_tool -id "@rpath/${fw}/${name}" "$fw/${name}"
            minos=$(otool -l "$fw/${name}" | awk '/LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS/{v=1} v && /(minos|version)/{print $2; exit}')
            : "${minos:=16.0}"   # guard: empty if neither load command matched
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict>' \
              "<key>CFBundleExecutable</key><string>${name}</string>" \
              "<key>CFBundleIdentifier</key><string>org.litertlmsharp.${name}</string>" \
              '<key>CFBundleInfoDictionaryVersion</key><string>6.0</string>' \
              "<key>CFBundleName</key><string>${name}</string>" \
              '<key>CFBundlePackageType</key><string>FMWK</string>' \
              '<key>CFBundleShortVersionString</key><string>1.0</string>' \
              '<key>CFBundleVersion</key><string>1</string>' \
              "<key>MinimumOSVersion</key><string>${minos}</string>" \
              '<key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>' \
              '<key>DTPlatformName</key><string>iphoneos</string>' \
              '</dict></plist>' > "$fw/Info.plist"
            codesign --force --sign - "$fw"
            xcodebuild -create-xcframework -framework "$fw" -output "xcframeworks/${name}.xcframework"
            rm -rf "$fw"
          done
          echo "--- xcframeworks (packed into LiteRtLmSharp.runtime.ios-arm64) ---"
          ls -lR xcframeworks

      - uses: actions/upload-artifact@v4
        with:
          name: litertlm-ios_arm64
          path: artifacts/

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux-x64, build-windows-x64, build-android-arm64, build-macos-arm64, build-ios-arm64]
    # Run as long as nothing failed (skipped platform jobs are fine) and publishing was requested.
    if: ${{ !cancelled() && inputs.publish_release && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package archives + checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          for rid in linux_x86_64 windows_x86_64 android_arm64 macos_arm64 ios_arm64; do
            dir="artifacts/litertlm-${rid}"
            [ -d "$dir" ] && tar -czf "release/litertlm-${rid}.tar.gz" -C "$dir" . || echo "skip ${rid} (not built this run)"
          done
          cd release
          # Merge with the existing release's checksums so a partial (platform-filtered) run
          # doesn't clobber checksums of assets that weren't rebuilt.
          gh release download "native-${LITERTLM_VERSION}" --repo "${{ github.repository }}" \
            --pattern 'checksums.txt' --output existing.txt 2>/dev/null || touch existing.txt
          sha256sum *.tar.gz > new.txt 2>/dev/null || touch new.txt
          awk '{print $2, $0}' new.txt existing.txt | sort -u -k1,1 | cut -d' ' -f2- > checksums.txt
          rm -f existing.txt new.txt
          cat checksums.txt

      - name: Create/update Release native-${{ env.LITERTLM_VERSION }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-${{ env.LITERTLM_VERSION }}
          name: LiteRT-LM native ${{ env.LITERTLM_VERSION }}
          body: |
            LiteRT-LM C API shared libraries built from source `${{ env.LITERTLM_VERSION }}`
            via `native/patch_c_api.sh`. Platforms: linux-x64, win-x64, android-arm64, macos-arm64, ios-arm64
            (assets accumulate across platform-filtered runs).

            Consume with `scripts/restore-natives.ps1` (update its `$version` to match).
          files: release/*
          fail_on_unmatched_files: false
