name: Build LiteRT-LM native libraries

# Builds our own libLiteRtLm.so (linux-x64) and LiteRtLm.dll (win-x64) from a
# pinned LiteRT-LM ref, using native/patch_c_api.sh to add the shared-lib target
# (upstream has none yet — issue #2154). Accelerator companions are pulled from
# the repo's prebuilt/<platform>/ via git-lfs. Optionally publishes them as a
# GitHub Release (tag native-<ref>) on THIS repo, which scripts/restore-natives.ps1
# can then consume instead of the community prebuilt.
#
# Pinning header + binary to the same ref eliminates the ABI skew we hit with the
# community 0.12.0-a binary (conversation_config crash, missing get_token_count).
#
# Run manually from the Actions tab (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      litertlm_version:
        description: 'LiteRT-LM ref (tag, branch, or commit SHA).'
        required: true
        # Release tag: version-synced with Google, includes get_token_count, and is the
        # target for streaming-fix validation. Proven fallback commit if a tag regresses:
        # 032334d81ff96431492be272e536fbafe094b1e9
        default: 'v0.13.1'
      platforms:
        description: 'Platforms to build (comma-separated: linux-x64,win-x64,android-arm64,macos-arm64,ios-arm64) or "all". Build only NEW platforms to save Actions minutes; the release keeps existing assets.'
        required: true
        default: 'all'
      publish_release:
        description: 'Publish artifacts to a GitHub Release on this repo'
        type: boolean
        default: false

jobs:
  build-linux-x64:
    name: linux-x64
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'linux-x64')
    # glibc 2.35 baseline for broad compatibility (Ubuntu 22.04+ / Debian 12+ / RHEL 9+).
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-17 (XNNPACK AVX-VNNI requires clang >= 15)
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 17
          sudo ln -sf /usr/bin/clang-17 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-17 /usr/bin/clang++
          clang --version

      - name: Clone LiteRT-LM @ ${{ env.LITERTLM_VERSION }}
        run: |
          git clone https://github.com/google-ai-edge/LiteRT-LM /tmp/LiteRT-LM
          cd /tmp/LiteRT-LM
          git checkout "$LITERTLM_VERSION"
          git lfs pull --include="prebuilt/linux_x86_64/*"

      - name: Patch C API (add shared-lib target)
        run: bash native/patch_c_api.sh /tmp/LiteRT-LM

      - name: Build libLiteRtLm.so
        run: |
          cd /tmp/LiteRT-LM
          bazelisk build -c opt --strip=always \
            --define=litert_link_capi_so=true \
            //c:libLiteRtLm.dylib

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp /tmp/LiteRT-LM/bazel-bin/c/libLiteRtLm.dylib artifacts/libLiteRtLm.so
          cp /tmp/LiteRT-LM/prebuilt/linux_x86_64/*.so artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: litertlm-linux_x86_64
          path: artifacts/

  build-windows-x64:
    name: win-x64
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'win-x64')
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
      ANDROID_NDK_HOME: ''
      BAZEL_OUTPUT_BASE: 'D:\b'   # short path: Bazel + Windows long-path limits
    steps:
      - uses: actions/checkout@v4

      - name: Configure git for long paths + symlinks
        run: |
          git config --global core.symlinks true
          git config --system core.longpaths true

      - name: Clone LiteRT-LM @ ${{ env.LITERTLM_VERSION }}
        run: |
          git clone https://github.com/google-ai-edge/LiteRT-LM C:\LiteRT-LM
          cd C:\LiteRT-LM
          git checkout "$env:LITERTLM_VERSION"
          git lfs pull --include="prebuilt/windows_x86_64/*"

      - name: Patch C API (add shared-lib target)
        shell: bash
        run: bash native/patch_c_api.sh C:/LiteRT-LM

      - name: Build LiteRtLm.dll
        # resolve_symbols_in_exec=false is required on Windows — without it Bazel
        # cannot resolve LiteRt* imports at link time (unresolved externals).
        run: |
          cd C:\LiteRT-LM
          bazel --output_base="$env:BAZEL_OUTPUT_BASE" `
            build -c opt `
            --linkopt=/OPT:REF --linkopt=/OPT:ICF `
            --build_tag_filters='-nowindows' `
            --features=compiler_param_file `
            --features=archive_param_file `
            --spawn_strategy=local `
            --define=litert_link_capi_so=true `
            --define=resolve_symbols_in_exec=false `
            //c:libLiteRtLm.dylib

      - name: Download DirectXShaderCompiler runtime (WebGPU/DX12 GPU)
        run: |
          $dxcUrl = 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602/dxc_2026_02_20.zip'
          Invoke-WebRequest -Uri $dxcUrl -OutFile dxc.zip
          Expand-Archive -Path dxc.zip -DestinationPath dxc -Force

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item C:\LiteRT-LM\bazel-bin\c\libLiteRtLm.dylib artifacts\LiteRtLm.dll

          $prebuilt = 'C:\LiteRT-LM\prebuilt\windows_x86_64'
          # Copy every prebuilt DLL as-is (satisfies LiteRtLm.dll's PE imports,
          # which reference the original lib*-prefixed names).
          Get-ChildItem "$prebuilt\*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination artifacts\ -Force
          # Also ship prefixless copies of the lib* accelerators (matches the
          # filenames the NativeLibraryResolver / default loader probe for).
          Get-ChildItem 'artifacts\lib*.dll' | ForEach-Object {
            $stripped = $_.Name -replace '^lib',''
            Copy-Item $_.FullName "artifacts\$stripped" -Force
          }
          # DXC runtime (x64).
          foreach ($dxc in 'dxil.dll','dxcompiler.dll') {
            $src = Get-ChildItem -Recurse -Filter $dxc -Path dxc | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
            if (-not $src) { $src = Get-ChildItem -Recurse -Filter $dxc -Path dxc | Select-Object -First 1 }
            if (-not $src) { throw "DXC runtime missing: $dxc" }
            Copy-Item $src.FullName "artifacts\$dxc" -Force
          }
          Get-ChildItem artifacts\ | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: litertlm-windows_x86_64
          path: artifacts/

  build-android-arm64:
    name: android-arm64
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'android-arm64')
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android NDK
        # The runner ships an NDK; LiteRT-LM wants r28b+. If the default is too old the
        # Bazel step will say so — pin a newer NDK here (e.g. nttld/setup-ndk) if needed.
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          echo "Using NDK at ${ANDROID_NDK_LATEST_HOME}"
          ls "${ANDROID_NDK_LATEST_HOME}/source.properties" && cat "${ANDROID_NDK_LATEST_HOME}/source.properties" || true

      - name: Clone LiteRT-LM @ ${{ env.LITERTLM_VERSION }}
        run: |
          git clone https://github.com/google-ai-edge/LiteRT-LM /tmp/LiteRT-LM
          cd /tmp/LiteRT-LM
          git checkout "$LITERTLM_VERSION"
          git lfs pull --include="prebuilt/android_arm64/*"

      - name: Patch C API (add shared-lib target)
        run: bash native/patch_c_api.sh /tmp/LiteRT-LM

      - name: Build libLiteRtLm.so (android-arm64)
        # No litert_link_capi_so: Android has no separate libLiteRt.so in prebuilt/, so the
        # LiteRt C API is static-linked into libLiteRtLm.so (exported via the dynamic-list).
        # max-page-size=16384 satisfies Google Play's 16 KB page-size requirement.
        run: |
          cd /tmp/LiteRT-LM
          bazelisk build -c opt --strip=always \
            --config=android_arm64 \
            --linkopt=-Wl,-z,max-page-size=16384 \
            //c:libLiteRtLm.dylib

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp /tmp/LiteRT-LM/bazel-bin/c/libLiteRtLm.dylib artifacts/libLiteRtLm.so
          cp /tmp/LiteRT-LM/prebuilt/android_arm64/*.so artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Patch GPU samplers (add DT_NEEDED libLiteRtLm.so)
        # Google's prebuilt TopK samplers reference LiteRt* symbols but ship without a
        # DT_NEEDED on libLiteRtLm.so, so their dlopen fails ("cannot locate symbol
        # LiteRtCreateEnvironment") and sampling falls back to CPU (upstream LiteRT-LM#2211;
        # same fix flutter_gemma ships since 0.15.1). Note: bionic ignores
        # RTLD_NOLOAD|RTLD_GLOBAL flag promotion, so a consumer-side fix is not possible.
        # Known caveat from #2211: a few devices (e.g. Tensor G2) reject patchelf-modified
        # ELFs — the failure mode there is the same graceful CPU-sampling fallback as today.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q patchelf
          for f in artifacts/libLiteRtTopKOpenClSampler.so artifacts/libLiteRtTopKWebGpuSampler.so; do
            if [ -f "$f" ]; then
              patchelf --add-needed libLiteRtLm.so "$f"
              echo "$f NEEDED:"; patchelf --print-needed "$f"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: litertlm-android_arm64
          path: artifacts/

  build-macos-arm64:
    name: macos-arm64
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'macos-arm64')
    # NOTE: macOS runners bill at a 10x minutes multiplier on private repos — build this
    # platform alone (platforms=macos-arm64) and avoid rebuilding the others.
    runs-on: macos-15
    timeout-minutes: 120
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone LiteRT-LM @ ${{ env.LITERTLM_VERSION }}
        run: |
          git clone https://github.com/google-ai-edge/LiteRT-LM /tmp/LiteRT-LM
          cd /tmp/LiteRT-LM
          git checkout "$LITERTLM_VERSION"
          git lfs pull --include="prebuilt/macos_arm64/*"

      - name: Patch C API (add shared-lib target)
        run: bash native/patch_c_api.sh /tmp/LiteRT-LM

      - name: Build libLiteRtLm.dylib (macos-arm64)
        # Like linux-x64: LiteRt stays a SEPARATE shared lib (litert_link_capi_so) so the
        # prebuilt Metal sampler — which carries LC_LOAD_DYLIB @rpath/libLiteRt.dylib — can
        # load it at runtime (static linking made its dlopen fail and sampling fall back to
        # CPU). resolve_symbols_in_exec=false is REQUIRED with it on macOS: the repo
        # .bazelrc defaults that define to true, and with both set the upstream
        # @litert//litert/c:litert_runtime_c_api_shared_lib srcs select() has two matching
        # conditions (:resolve_symbols_in_exec and :macos) -> "illegal ambiguous match".
        # Google's own CI-Mac dylib pass uses this exact define pair. The patch adds
        # -rpath @loader_path so companion dylibs resolve from the same directory.
        run: |
          cd /tmp/LiteRT-LM
          bazelisk build -c opt --strip=always \
            --define=litert_link_capi_so=true \
            --define=resolve_symbols_in_exec=false \
            //c:libLiteRtLm.dylib

      - name: Collect artifacts
        # flutter_gemma's companion set PLUS Google's prebuilt libLiteRt.dylib (the runtime
        # both libLiteRtLm.dylib and the Metal sampler now resolve via @rpath — same
        # arrangement as linux-x64's libLiteRt.so). Still exclude the WebGPU pair (Metal is
        # the macOS GPU backend).
        run: |
          mkdir -p artifacts
          cp /tmp/LiteRT-LM/bazel-bin/c/libLiteRtLm.dylib artifacts/libLiteRtLm.dylib
          for lib in libLiteRt libGemmaModelConstraintProvider libLiteRtMetalAccelerator libLiteRtTopKMetalSampler; do
            cp "/tmp/LiteRT-LM/prebuilt/macos_arm64/${lib}.dylib" artifacts/ 2>/dev/null || echo "missing ${lib}"
          done
          ls -lh artifacts/
          echo "--- exported litert_lm_* symbols ---"
          nm -gU artifacts/libLiteRtLm.dylib | grep -c litert_lm_ || true
          echo "--- libLiteRtLm.dylib load commands (expect @rpath/libLiteRt.dylib) ---"
          otool -L artifacts/libLiteRtLm.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: litertlm-macos_arm64
          path: artifacts/

  build-ios-arm64:
    name: ios-arm64
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'ios-arm64')
    # NOTE: macOS runners bill at 10x on private repos — run platform-filtered.
    runs-on: macos-15
    timeout-minutes: 120
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone LiteRT-LM @ ${{ env.LITERTLM_VERSION }}
        run: |
          git clone https://github.com/google-ai-edge/LiteRT-LM /tmp/LiteRT-LM
          cd /tmp/LiteRT-LM
          git checkout "$LITERTLM_VERSION"
          git lfs pull --include="prebuilt/ios_arm64/*"

      - name: Patch C API (add shared-lib target)
        run: bash native/patch_c_api.sh /tmp/LiteRT-LM

      - name: Build libLiteRtLm.dylib (ios-arm64, device)
        # Same recipe as macOS: LiteRt as a SEPARATE shared lib so the prebuilt Metal
        # sampler (LC_LOAD_DYLIB @rpath/libLiteRt.dylib) can dlopen — static linking made
        # it silently fall back to CPU sampling (proven on macOS, model-tests 27436193072).
        # resolve_symbols_in_exec=false is REQUIRED with capi_so: the repo .bazelrc defaults
        # it to true and the pinned @litert litert_runtime_c_api_shared_lib srcs select()
        # has both :resolve_symbols_in_exec and :ios keys -> "illegal ambiguous match".
        # NOTE: upstream CI never builds iOS with this define pair (only macOS); if this
        # fails (e.g. ld platform mismatch on the @litert-built dylib), fall back to the
        # static recipe + install_name_tool -change on the sampler.
        # --config=ios_arm64 sets ios_minimum_os=13.0.
        run: |
          cd /tmp/LiteRT-LM
          bazelisk build -c opt --strip=always \
            --config=ios_arm64 \
            --define=litert_link_capi_so=true \
            --define=resolve_symbols_in_exec=false \
            //c:libLiteRtLm.dylib

      - name: Collect artifacts
        # Full prebuilt/ios_arm64 companion set INCLUDING libLiteRt.dylib (the runtime the
        # main dylib and Metal sampler resolve via @rpath, like macOS/linux). Google ships
        # some companions with minos 26.2 — apps targeting older iOS fail to embed them.
        # Same fix flutter_gemma uses (#245): vtool the minos down to 16.0 (keeping the sdk
        # version) and re-sign ad-hoc (vtool invalidates the signature; the app build
        # re-signs everything anyway). The loop globs artifacts/*.dylib so libLiteRt.dylib
        # is patched too.
        run: |
          mkdir -p artifacts
          cp /tmp/LiteRT-LM/bazel-bin/c/libLiteRtLm.dylib artifacts/libLiteRtLm.dylib
          for lib in libLiteRt libGemmaModelConstraintProvider libLiteRtMetalAccelerator libLiteRtTopKMetalSampler; do
            cp "/tmp/LiteRT-LM/prebuilt/ios_arm64/${lib}.dylib" artifacts/ 2>/dev/null || echo "missing ${lib}"
          done

          chmod +w artifacts/*.dylib
          for f in artifacts/*.dylib; do
            minos=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{v=1} v && /minos/{print $2; exit}')
            sdk=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{v=1} v && /sdk/{print $2; exit}')
            if [ "$(printf '%s\n' "16.1" "$minos" | sort -V | head -1)" = "16.1" ]; then
              echo "patching $f: minos $minos -> 16.0 (sdk $sdk)"
              vtool -set-build-version ios 16.0 "$sdk" -replace -output "$f" "$f"
              codesign --force --sign - "$f"
            fi
          done

          ls -lh artifacts/
          echo "--- exported litert_lm_* symbols ---"
          nm -gU artifacts/libLiteRtLm.dylib | grep -c litert_lm_ || true
          echo "--- libLiteRtLm.dylib load commands (expect @rpath/libLiteRt.dylib) ---"
          otool -L artifacts/libLiteRtLm.dylib
          echo "--- platform/min-OS of each dylib (post-patch) ---"
          for f in artifacts/*.dylib; do
            echo "== $f"
            otool -l "$f" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | head -8
          done

      - uses: actions/upload-artifact@v4
        with:
          name: litertlm-ios_arm64
          path: artifacts/

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux-x64, build-windows-x64, build-android-arm64, build-macos-arm64, build-ios-arm64]
    # Run as long as nothing failed (skipped platform jobs are fine) and publishing was requested.
    if: ${{ !cancelled() && inputs.publish_release && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package archives + checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          for rid in linux_x86_64 windows_x86_64 android_arm64 macos_arm64 ios_arm64; do
            dir="artifacts/litertlm-${rid}"
            [ -d "$dir" ] && tar -czf "release/litertlm-${rid}.tar.gz" -C "$dir" . || echo "skip ${rid} (not built this run)"
          done
          cd release
          # Merge with the existing release's checksums so a partial (platform-filtered) run
          # doesn't clobber checksums of assets that weren't rebuilt.
          gh release download "native-${LITERTLM_VERSION}" --repo "${{ github.repository }}" \
            --pattern 'checksums.txt' --output existing.txt 2>/dev/null || touch existing.txt
          sha256sum *.tar.gz > new.txt 2>/dev/null || touch new.txt
          awk '{print $2, $0}' new.txt existing.txt | sort -u -k1,1 | cut -d' ' -f2- > checksums.txt
          rm -f existing.txt new.txt
          cat checksums.txt

      - name: Create/update Release native-${{ env.LITERTLM_VERSION }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-${{ env.LITERTLM_VERSION }}
          name: LiteRT-LM native ${{ env.LITERTLM_VERSION }}
          body: |
            LiteRT-LM C API shared libraries built from source `${{ env.LITERTLM_VERSION }}`
            via `native/patch_c_api.sh`. Platforms: linux-x64, win-x64, android-arm64, macos-arm64
            (assets accumulate across platform-filtered runs).

            Consume with `scripts/restore-natives.ps1` (update its `$version` to match).
          files: release/*
          fail_on_unmatched_files: false
