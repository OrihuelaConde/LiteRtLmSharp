name: Native release (official LiteRT-LM prebuilts)

# Repackages Google's OFFICIAL LiteRT-LM C API prebuilts into this repo's native layout and
# publishes them as the `native-<tag>` GitHub Release that ci.yml, model-tests.yml,
# pack-nuget.yml, ios-package-check.yml and scripts/restore-natives.ps1 consume.
#
# Upstream ships ONE monolithic shared library per platform (constraint provider, GPU accelerators,
# GPU samplers and LlGuidance embedded; static CRT on Windows) plus `CLiteRTLM.xcframework.zip` for
# iOS. Two sources carry the Linux, Windows, Android and macOS libraries (`source` input, see
# fetch-capi-libs.sh):
#   zip   `litert_lm_c_api-<capi_version>.zip`, a release asset. Upstream shipped it with v0.16.0 only
#         and paused it while it renames functions (LiteRT-LM#3569).
#   pypi  the `litert-lm-api` wheels, published with every release: each is a ctypes wrapper around the
#         same C API library, with every function of the release's headers exported.
#   auto  (default) the zip when the release carries it, else the wheels.
# This workflow replaced the Bazel self-build (git history: build-native.yml + native/patch_c_api.sh)
# after the v0.16.0 evaluation recorded in docs/roadmap.md.
#
# What each release asset contains (our library names; the P/Invoke name stays `LiteRtLm`):
#   litertlm-linux_x86_64.tar.gz    libLiteRtLm.so
#   litertlm-linux_arm64.tar.gz     libLiteRtLm.so
#   litertlm-windows_x86_64.tar.gz  LiteRtLm.dll + dxcompiler.dll + dxil.dll   Dawn/D3D12 requires DXC
#   litertlm-android_arm64.tar.gz   libLiteRtLm.so
#   litertlm-android_x86_64.tar.gz  libLiteRtLm.so   (x86_64 Android emulator)
#   litertlm-macos_arm64.tar.gz     libLiteRtLm.dylib
#   litertlm-ios_arm64.tar.gz       xcframeworks/CLiteRTLM.xcframework   official name kept (device + simulator slices)
#
# Every upstream download is verified against the sha256 digest its host records (GitHub for release
# assets, PyPI for wheels), and every library is inspected (architecture, export surface, dependencies,
# embedded samplers) before it is packaged, so a regressed upstream build fails here instead of in a
# consumer.
#
# Run manually from the Actions tab (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      litertlm_version:
        description: 'LiteRT-LM release tag (release tag here = native-<tag>).'
        required: true
        default: 'v0.18.0'
      source:
        description: 'Where the Linux, Windows, Android and macOS libraries come from: the C API zip release asset, the litert-lm-api wheels on PyPI, or auto (the zip when the release has it, else PyPI).'
        type: choice
        options: [auto, zip, pypi]
        default: auto
      capi_version:
        description: 'C API prebuilt version (source=zip only: the zip name suffix, litert_lm_c_api-<capi_version>.zip).'
        required: false
        default: '0.1.0'
      pypi_version:
        description: 'litert-lm-api version (source=pypi only; empty = the tag without its leading "v").'
        required: false
        default: ''
      platforms:
        description: 'Platforms to package (comma-separated: linux-x64,linux-arm64,win-x64,android-arm64,android-x64,macos-arm64,ios-arm64) or "all". The release keeps existing assets across partial runs.'
        required: true
        default: 'all'
      publish_release:
        description: 'Publish the assets to the native-<tag> GitHub Release on this repo'
        type: boolean
        default: false

env:
  UPSTREAM_REPO: google-ai-edge/LiteRT-LM
  # Defaults keep the workflow runnable when an input is left empty.
  UPSTREAM_TAG: ${{ inputs.litertlm_version || 'v0.18.0' }}
  # The jobs read the resolved source (auto -> zip or pypi) from the prepare job.
  SOURCE_INPUT: ${{ inputs.source || 'auto' }}
  CAPI_ZIP: litert_lm_c_api-${{ inputs.capi_version || '0.1.0' }}.zip
  PYPI_VERSION: ${{ inputs.pypi_version }}
  PLATFORMS: ${{ inputs.platforms || 'all' }}
  # Minimum litert_lm_* export count we accept (v0.16.0 ships 144, v0.18.0 212; the check catches a
  # truncated or wrong-architecture binary, not a specific version).
  MIN_EXPORTS: '140'
  # DirectX Shader Compiler runtime for win-x64 (the official DLL's Dawn requires DXC on D3D12 and
  # has no FXC fallback: without dxil.dll the GPU engine fails to create, "DynamicLib.Open: dxil.dll
  # Windows Error: 87"). Pinned by hash; this exact pair was validated on an RTX 3080 (2026-09) and is
  # byte-identical to the pair the v0.18.0 Windows wheel carries.
  DXC_URL: https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602/dxc_2026_02_20.zip
  DXC_SHA256: a1e89031421cf3c1fca6627766ab3020ca4f962ac7e2caa7fab2b33a8436151e

jobs:
  # Reads the inputs once: rejects unknown platform names, turns the list into one flag per platform
  # (the jobs test the flags, never the raw string, so a name cannot match as a substring of another)
  # and resolves source=auto against the release's assets.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.resolve.outputs.source }}
      zip_available: ${{ steps.resolve.outputs.zip_available }}
      elf_platforms: ${{ steps.resolve.outputs.elf_platforms }}
      capi_packaged: ${{ steps.resolve.outputs.capi_packaged }}
      linux_x64: ${{ steps.resolve.outputs.linux_x64 }}
      linux_arm64: ${{ steps.resolve.outputs.linux_arm64 }}
      win_x64: ${{ steps.resolve.outputs.win_x64 }}
      android_arm64: ${{ steps.resolve.outputs.android_arm64 }}
      android_x64: ${{ steps.resolve.outputs.android_x64 }}
      macos_arm64: ${{ steps.resolve.outputs.macos_arm64 }}
      ios_arm64: ${{ steps.resolve.outputs.ios_arm64 }}
    steps:
      - name: Resolve the platforms and the source
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          all="linux-x64 linux-arm64 win-x64 android-arm64 android-x64 macos-arm64 ios-arm64"
          list=$(printf '%s' "$PLATFORMS" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          if [ -z "$list" ] || [ "$list" = all ]; then selected="$all"; else selected=$(tr ',' ' ' <<< "$list"); fi
          [ -n "${selected// /}" ] || { echo "::error::No platform selected."; exit 1; }
          for p in $selected; do
            case " $all " in
              *" $p "*) ;;
              *) echo "::error::Unknown platform '$p' (valid: ${all// /,} or all)"; exit 1 ;;
            esac
          done
          on() { case " $selected " in *" $1 "*) echo true ;; *) echo false ;; esac; }
          elf=""
          for p in $all; do
            flag=$(on "$p")
            echo "${p//-/_}=$flag" >> "$GITHUB_OUTPUT"
            echo "$p: $flag"
          done
          [ "$(on linux-x64)" = true ] && elf+=" linux_x86_64"
          [ "$(on linux-arm64)" = true ] && elf+=" linux_arm64"
          [ "$(on android-arm64)" = true ] && elf+=" android_arm64"
          [ "$(on android-x64)" = true ] && elf+=" android_x86_64"
          echo "elf_platforms=${elf# }" >> "$GITHUB_OUTPUT"
          capi=false
          if [ -n "$elf" ] || [ "$(on win-x64)" = true ] || [ "$(on macos-arm64)" = true ]; then capi=true; fi
          echo "capi_packaged=$capi" >> "$GITHUB_OUTPUT"

          has_zip=$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${UPSTREAM_TAG}" \
            --jq "[.assets[] | select(.name == \"${CAPI_ZIP}\")] | length")
          zip_available=false
          [ "$has_zip" = 1 ] && zip_available=true
          source=$SOURCE_INPUT
          if [ "$source" = auto ]; then
            if [ "$zip_available" = true ]; then source=zip; else source=pypi; fi
          elif [ "$source" = zip ] && [ "$zip_available" = false ] && [ "$capi" = true ]; then
            echo "::error::${UPSTREAM_TAG} has no ${CAPI_ZIP} asset: run with source=auto or source=pypi."
            exit 1
          fi
          echo "source=$source (input $SOURCE_INPUT; ${CAPI_ZIP} on the release: $zip_available)"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "zip_available=$zip_available" >> "$GITHUB_OUTPUT"

  # The Linux and Android libraries are all ELF, so one Linux runner inspects them with binutils.
  elf:
    name: linux + android
    needs: prepare
    if: needs.prepare.outputs.elf_platforms != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify the official libraries
        env:
          GH_TOKEN: ${{ github.token }}
          ELF_PLATFORMS: ${{ needs.prepare.outputs.elf_platforms }}
        run: |
          set -euo pipefail
          read -r -a plats <<< "$ELF_PLATFORMS"
          bash .github/scripts/fetch-capi-libs.sh "$SOURCE" capi "${plats[@]}"

      - name: Package linux-x64
        if: needs.prepare.outputs.linux_x64 == 'true'
        run: bash .github/scripts/package-elf.sh capi/lib/linux_x86_64/liblitert-lm.so artifacts/linux_x86_64 linux X86-64

      - name: Package linux-arm64
        if: needs.prepare.outputs.linux_arm64 == 'true'
        run: bash .github/scripts/package-elf.sh capi/lib/linux_arm64/liblitert-lm.so artifacts/linux_arm64 linux AArch64

      - name: Package android-arm64
        if: needs.prepare.outputs.android_arm64 == 'true'
        run: bash .github/scripts/package-elf.sh capi/lib/android_arm64/liblitert-lm.so artifacts/android_arm64 android AArch64

      - name: Package android-x64
        if: needs.prepare.outputs.android_x64 == 'true'
        run: bash .github/scripts/package-elf.sh capi/lib/android_x86_64/liblitert-lm.so artifacts/android_x86_64 android X86-64

      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.linux_x64 == 'true'
        with:
          name: litertlm-linux_x86_64
          path: artifacts/linux_x86_64/

      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.linux_arm64 == 'true'
        with:
          name: litertlm-linux_arm64
          path: artifacts/linux_arm64/

      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.android_arm64 == 'true'
        with:
          name: litertlm-android_arm64
          path: artifacts/android_arm64/

      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.android_x64 == 'true'
        with:
          name: litertlm-android_x86_64
          path: artifacts/android_x86_64/

  win-x64:
    name: win-x64
    needs: prepare
    if: needs.prepare.outputs.win_x64 == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify the official library
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-capi-libs.sh "$SOURCE" capi windows_x86_64

      - name: Download and verify the DXC runtime
        run: |
          Invoke-WebRequest -Uri $env:DXC_URL -OutFile dxc.zip
          $actual = (Get-FileHash -Algorithm SHA256 dxc.zip).Hash.ToLower()
          if ($actual -ne $env:DXC_SHA256) { throw "DXC zip hash mismatch: expected $env:DXC_SHA256, got $actual" }
          Expand-Archive -Path dxc.zip -DestinationPath dxc -Force

      - name: Package win-x64
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item capi/lib/windows_x86_64/bin/litert-lm.dll artifacts/LiteRtLm.dll
          foreach ($dxc in 'dxil.dll', 'dxcompiler.dll') {
            $src = Join-Path dxc "bin/x64/$dxc"
            if (-not (Test-Path $src)) { throw "DXC runtime missing from the zip: bin/x64/$dxc" }
            Copy-Item $src "artifacts/$dxc" -Force
          }
          Get-ChildItem artifacts | Select-Object Name, Length

      - name: Inspect LiteRtLm.dll (exports, imports, CRT)
        run: |
          python -m pip install --quiet pefile
          python .github/scripts/inspect-pe.py artifacts/LiteRtLm.dll $env:MIN_EXPORTS

      - uses: actions/upload-artifact@v4
        with:
          name: litertlm-windows_x86_64
          path: artifacts/

  apple:
    name: macos-arm64 + ios-arm64
    needs: prepare
    if: needs.prepare.outputs.macos_arm64 == 'true' || needs.prepare.outputs.ios_arm64 == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify the official macOS library
        if: needs.prepare.outputs.macos_arm64 == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-capi-libs.sh "$SOURCE" capi macos_arm64

      - name: Package macos-arm64
        if: needs.prepare.outputs.macos_arm64 == 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts/macos
          cp capi/lib/macos_arm64/liblitert-lm.dylib artifacts/macos/libLiteRtLm.dylib
          lib=artifacts/macos/libLiteRtLm.dylib
          echo "--- architecture ---"
          lipo -info "$lib"
          lipo -info "$lib" | grep -q arm64 || { echo "::error::macos library is not arm64"; exit 1; }
          # tail -n +2 skips otool's header line (the file path, which contains our own library name).
          deps=$(otool -L "$lib" | tail -n +2)
          echo "--- load commands (system frameworks only; no @rpath/libLiteRt*) ---"
          echo "$deps"
          if grep -q 'libLiteRt' <<< "$deps"; then
            echo "::error::macos library expects a separate libLiteRt companion — not the monolithic layout this workflow packages"; exit 1
          fi
          cnt=$(nm -gU "$lib" | grep -c ' _litert_lm_' || true)
          echo "exported litert_lm_* symbols: $cnt"
          [ "$cnt" -ge "$MIN_EXPORTS" ] || { echo "::error::expected >= $MIN_EXPORTS litert_lm_* exports, got $cnt"; exit 1; }
          echo "--- minimum macOS version ---"
          vtool -show-build "$lib" | grep -E 'platform|minos|sdk' || true
          ls -la artifacts/macos

      - name: Download and verify the official iOS xcframework
        if: needs.prepare.outputs.ios_arm64 == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-upstream-asset.sh CLiteRTLM.xcframework.zip upstream

      - name: Package ios-arm64
        if: needs.prepare.outputs.ios_arm64 == 'true'
        # The official xcframework is shipped AS IS under its own name (CLiteRTLM): the managed
        # resolver loads Frameworks/CLiteRTLM.framework/CLiteRTLM on iOS and the runtime package's
        # buildTransitive .targets references CLiteRTLM.xcframework. Re-wrapping it under our name
        # would mean re-signing and rewriting install names for no functional gain.
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios/xcframeworks
          unzip -q upstream/CLiteRTLM.xcframework.zip -d artifacts/ios/xcframeworks
          find artifacts/ios/xcframeworks -name '._*' -delete
          find artifacts/ios/xcframeworks -name '__MACOSX' -type d -prune -exec rm -rf {} +
          xcf=artifacts/ios/xcframeworks/CLiteRTLM.xcframework
          [ -f "$xcf/Info.plist" ] || { echo "::error::CLiteRTLM.xcframework/Info.plist not found after extraction:"; find artifacts/ios -maxdepth 3; exit 1; }
          echo "--- slices ---"
          plutil -p "$xcf/Info.plist" | grep -E 'LibraryIdentifier|SupportedPlatform' || true
          plutil -p "$xcf/Info.plist" | grep -q '"ios-arm64"' || { echo "::error::no ios-arm64 device slice in the xcframework"; exit 1; }
          device=$(find "$xcf/ios-arm64" -type f -path '*CLiteRTLM.framework/CLiteRTLM' | head -1)
          [ -n "$device" ] || { echo "::error::device framework binary not found"; exit 1; }
          echo "--- device binary: $device ---"
          lipo -info "$device"
          otool -L "$device"
          vtool -show-build "$device" | grep -E 'platform|minos|sdk' || true
          cnt=$(nm -gU "$device" | grep -c ' _litert_lm_' || true)
          echo "exported litert_lm_* symbols: $cnt"
          [ "$cnt" -ge "$MIN_EXPORTS" ] || { echo "::error::expected >= $MIN_EXPORTS litert_lm_* exports, got $cnt"; exit 1; }
          echo "--- GPU companions referenced by name (documented: CPU-only with the xcframework alone) ---"
          strings "$device" | grep -E 'libLiteRt(MetalAccelerator|TopKMetalSampler)\.dylib' | sort -u || true
          ls -R artifacts/ios | head -40

      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.macos_arm64 == 'true'
        with:
          name: litertlm-macos_arm64
          path: artifacts/macos/

      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.ios_arm64 == 'true'
        with:
          name: litertlm-ios_arm64
          path: artifacts/ios/

  publish-release:
    name: Publish GitHub Release
    needs: [prepare, elf, win-x64, apple]
    # Run as long as nothing failed (skipped platform jobs are fine) and publishing was requested.
    if: ${{ !cancelled() && inputs.publish_release && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      ZIP_AVAILABLE: ${{ needs.prepare.outputs.zip_available }}
      CAPI_PACKAGED: ${{ needs.prepare.outputs.capi_packaged }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Fetch upstream license notices
        # Shipped as a release asset next to the tarballs; pack-nuget.yml places it in the packages.
        # Releases since v0.17.0 carry no THIRD_PARTY_NOTICES.txt asset: the notices are then built
        # from the license bundle inside the release's official CLiteRTLM.xcframework.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          has_notices=$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${UPSTREAM_TAG}" \
            --jq '[.assets[] | select(.name == "THIRD_PARTY_NOTICES.txt")] | length')
          if [ "$has_notices" = "1" ]; then
            bash .github/scripts/fetch-upstream-asset.sh THIRD_PARTY_NOTICES.txt upstream
            cp upstream/THIRD_PARTY_NOTICES.txt release/THIRD_PARTY_NOTICES.litert-lm.txt
            echo "NOTICES_SOURCE=the release's THIRD_PARTY_NOTICES.txt" >> "$GITHUB_ENV"
          else
            bash .github/scripts/fetch-upstream-asset.sh CLiteRTLM.xcframework.zip upstream
            python3 .github/scripts/notices-from-xcframework.py \
              upstream/CLiteRTLM.xcframework.zip release/THIRD_PARTY_NOTICES.litert-lm.txt "$UPSTREAM_TAG"
            echo "NOTICES_SOURCE=the license bundle of the release's CLiteRTLM.xcframework (the release has no THIRD_PARTY_NOTICES.txt)" >> "$GITHUB_ENV"
          fi
          # The body names the library source only when this run packaged C API libraries; a run that
          # repackaged only the iOS framework keeps the body the release already has (next step).
          if [ "$CAPI_PACKAGED" = true ]; then
            if [ "$SOURCE" = pypi ]; then
              note=""
              [ "$ZIP_AVAILABLE" = true ] || note="; upstream published no C API zip for this release"
              echo "LIB_SOURCE=the litert-lm-api ${PYPI_VERSION:-${UPSTREAM_TAG#v}} wheels on PyPI (verified against PyPI's sha256 digests${note})" >> "$GITHUB_ENV"
            else
              echo "LIB_SOURCE=${CAPI_ZIP} (verified against GitHub's per-asset sha256 digest)" >> "$GITHUB_ENV"
            fi
          fi

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${LIB_SOURCE:-}" ] \
             && gh release view "native-${UPSTREAM_TAG}" --repo "${{ github.repository }}" --json body --jq .body > body.md 2>/dev/null \
             && [ -s body.md ]; then
            echo "No C API library packaged in this run: the release keeps its current notes."
            exit 0
          fi
          python3 - > body.md <<'PY'
          import os
          tag = os.environ["UPSTREAM_TAG"]
          libs = os.environ.get("LIB_SOURCE") or "the official C API libraries (not packaged in this run)"
          notices = os.environ["NOTICES_SOURCE"]
          print(f"""Google's official LiteRT-LM C API prebuilts from the upstream release `{tag}`,
          repackaged into this repo's `runtimes/<rid>/native` layout under the library names the binding
          loads. The Linux, Windows, Android and macOS libraries come from {libs}; the iOS framework is the
          release's `CLiteRTLM.xcframework.zip` (verified against GitHub's sha256 digest). win-x64 adds the
          DirectX Shader Compiler runtime (`dxcompiler.dll`, `dxil.dll`, DXC v1.9.2602) that the official
          library's Dawn backend requires on Direct3D 12. `THIRD_PARTY_NOTICES.litert-lm.txt` comes from
          {notices}. Assets accumulate across platform-filtered runs.

          Consume with `scripts/restore-natives.ps1` (its default version tracks `LiteRtLmVersion`).""")
          PY
          cat body.md

      - name: Package archives + checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for rid in linux_x86_64 linux_arm64 windows_x86_64 android_arm64 android_x86_64 macos_arm64 ios_arm64; do
            dir="artifacts/litertlm-${rid}"
            if [ -d "$dir" ]; then
              tar -czf "release/litertlm-${rid}.tar.gz" -C "$dir" .
            else
              echo "skip ${rid} (not packaged this run)"
            fi
          done
          cd release
          # Merge with the existing release's checksums so a partial (platform-filtered) run
          # doesn't clobber checksums of assets that weren't repackaged.
          gh release download "native-${UPSTREAM_TAG}" --repo "${{ github.repository }}" \
            --pattern 'checksums.txt' --output existing.txt 2>/dev/null || touch existing.txt
          sha256sum *.tar.gz THIRD_PARTY_NOTICES.litert-lm.txt > new.txt 2>/dev/null || touch new.txt
          awk '{print $2, $0}' new.txt existing.txt | sort -u -k1,1 | cut -d' ' -f2- > checksums.txt
          rm -f existing.txt new.txt
          cat checksums.txt

      - name: Create/update Release native-${{ env.UPSTREAM_TAG }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-${{ env.UPSTREAM_TAG }}
          name: Native binaries — LiteRT-LM ${{ env.UPSTREAM_TAG }} (official prebuilts)
          body_path: body.md
          # The repo's "Latest" release is the library (v<version>, created by pack-nuget.yml); a native
          # set published between library releases must not take that place.
          make_latest: false
          files: release/*
          fail_on_unmatched_files: false
