name: Watch upstream LiteRT-LM releases

# Twice a week, compare the latest LiteRT-LM release tag against the version we pin in
# Directory.Build.props (<LiteRtLmVersion>). If upstream is ahead and there is no open
# issue for it yet, open one with the update checklist. Issues the watcher filed earlier
# are closed automatically once the pin catches up to the version they reported (issue #3
# lingered 11 days after the v0.14.0 repin because nothing closed it). Costs seconds of
# ubuntu time.

on:
  schedule:
    - cron: '0 9 * * 1,4' # Mon & Thu 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare pinned vs latest upstream tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(sed -n 's#.*<LiteRtLmVersion>\(.*\)</LiteRtLmVersion>.*#\1#p' Directory.Build.props)
          latest=$(gh api repos/google-ai-edge/LiteRT-LM/releases/latest --jq .tag_name)
          echo "pinned: $pinned — upstream latest: $latest"

          if [ -z "$pinned" ] || [ -z "$latest" ]; then
            echo "::error::Could not determine versions"; exit 1
          fi

          # Close previously filed update issues that the current pin resolves: an issue is done
          # exactly when the version it announced is <= the pinned one (sort -V handles v-prefixed
          # semver; equality included).
          gh issue list --state open --search 'in:title "Upstream LiteRT-LM"' \
            --json number,title --jq '.[] | "\(.number)\t\(.title)"' |
          while IFS=$'\t' read -r num title; do
            ver=$(echo "$title" | sed -n 's/^Upstream LiteRT-LM \([^ ]*\) released.*/\1/p')
            [ -z "$ver" ] && continue
            if [ "$(printf '%s\n%s\n' "$ver" "$pinned" | sort -V | tail -n1)" = "$pinned" ]; then
              echo "Closing stale issue #$num ($ver <= pinned $pinned)"
              gh issue close "$num" --comment "Resolved: the repo now pins \`$pinned\` (this issue reported \`$ver\`). Closed automatically by upstream-watch."
            fi
          done

          if [ "$pinned" = "$latest" ]; then
            echo "Up to date."; exit 0
          fi

          title="Upstream LiteRT-LM $latest released (we pin $pinned)"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "Issue already open."; exit 0
          fi

          gh issue create --title "$title" --body "$(cat <<EOF
          Google published [LiteRT-LM \`$latest\`](https://github.com/google-ai-edge/LiteRT-LM/releases/tag/$latest); we currently pin \`$pinned\`.

          Update checklist:
          - [ ] Skim the upstream changelog for C API changes (\`c/engine.h\`) and compare against our P/Invoke surface
          - [ ] Run **Build LiteRT-LM native libraries** with \`litertlm_version=$latest\` (all platforms) and \`publish_release=true\`
          - [ ] Validate locally (console sample: chat, streaming, \`--tools\`) with the new win-x64 binaries
          - [ ] Bump \`LiteRtLmVersion\` and \`Version\` in \`Directory.Build.props\`, update \`scripts/restore-natives.ps1\` default and \`ci.yml\` \`NATIVE_REF\`
          - [ ] Run **Pack NuGet packages** with the new version
          EOF
          )"
