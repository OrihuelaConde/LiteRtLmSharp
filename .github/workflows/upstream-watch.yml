name: Watch upstream LiteRT-LM releases

# Twice a week, compare the latest LiteRT-LM release tag against the version we pin in
# Directory.Build.props (<LiteRtLmVersion>). If upstream is ahead and there is no open
# issue for that version yet, open one with the update checklist. Issues the watcher filed earlier
# are closed automatically once the pin catches up to the version they reported (issue #3
# lingered 11 days after the v0.14.0 repin because nothing closed it) or once a newer release
# supersedes them. Costs seconds of ubuntu time.

on:
  schedule:
    - cron: '0 9 * * 1,4' # Mon & Thu 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare pinned vs latest upstream tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(sed -n 's#.*<LiteRtLmVersion>\(.*\)</LiteRtLmVersion>.*#\1#p' Directory.Build.props)
          latest=$(gh api repos/google-ai-edge/LiteRT-LM/releases/latest --jq .tag_name)
          echo "pinned: $pinned — upstream latest: $latest"

          if [ -z "$pinned" ] || [ -z "$latest" ]; then
            echo "::error::Could not determine versions"; exit 1
          fi

          # Close previously filed update issues that the current pin resolves: an issue is done
          # exactly when the version it announced is <= the pinned one (sort -V handles v-prefixed
          # semver; equality included).
          gh issue list --state open --search 'in:title "Upstream LiteRT-LM"' \
            --json number,title --jq '.[] | "\(.number)\t\(.title)"' |
          while IFS=$'\t' read -r num title; do
            ver=$(echo "$title" | sed -n 's/^Upstream LiteRT-LM \([^ ]*\) released.*/\1/p')
            [ -z "$ver" ] && continue
            if [ "$(printf '%s\n%s\n' "$ver" "$pinned" | sort -V | tail -n1)" = "$pinned" ]; then
              echo "Closing stale issue #$num ($ver <= pinned $pinned)"
              gh issue close "$num" --comment "Resolved: the repo now pins \`$pinned\` (this issue reported \`$ver\`). Closed automatically by upstream-watch."
            fi
          done

          if [ "$pinned" = "$latest" ]; then
            echo "Up to date."; exit 0
          fi

          # One issue per upstream version, whatever the pin was when it was filed.
          already=0
          while IFS=$'\t' read -r num title; do
            ver=$(echo "$title" | sed -n 's/^Upstream LiteRT-LM \([^ ]*\) released.*/\1/p')
            [ "$ver" = "$latest" ] && already=1
          done < <(gh issue list --state open --search 'in:title "Upstream LiteRT-LM"' \
                     --json number,title --jq '.[] | "\(.number)\t\(.title)"')
          if [ "$already" = 1 ]; then
            echo "Issue already open."; exit 0
          fi

          new_url=$(gh issue create --title "Upstream LiteRT-LM $latest released (we pin $pinned)" --body "$(cat <<EOF
          Google published [LiteRT-LM \`$latest\`](https://github.com/google-ai-edge/LiteRT-LM/releases/tag/$latest); we currently pin \`$pinned\`.

          Update checklist (details in \`docs/native-build.md\`, "Staying in sync with upstream"):
          - [ ] Read the release notes and diff the C API headers (\`c/*.h\`) against our P/Invoke surface: signatures, not only names
          - [ ] Run **Native release (official LiteRT-LM prebuilts)** with \`litertlm_version=$latest\`: \`source=zip\` when the release carries a \`litert_lm_c_api-*.zip\` asset, otherwise \`source=pypi\`; inspect the run, then re-run with \`publish_release=true\`
          - [ ] Bump \`LiteRtLmVersion\` in \`Directory.Build.props\`, \`NATIVE_REF\` in \`ci.yml\` and \`model-tests.yml\`, and the \`scripts/restore-natives.ps1\` default
          - [ ] Run the full model suite locally (CPU and GPU) and let CI run every leg
          - [ ] Release: version bump, CHANGELOG section, README compatibility row, then **Pack NuGet packages**
          EOF
          )")
          new_num=${new_url##*/}
          echo "Opened #$new_num"

          # A newer release supersedes the update issues filed for the releases in between.
          gh issue list --state open --search 'in:title "Upstream LiteRT-LM"' \
            --json number,title --jq '.[] | "\(.number)\t\(.title)"' |
          while IFS=$'\t' read -r num title; do
            [ "$num" = "$new_num" ] && continue
            ver=$(echo "$title" | sed -n 's/^Upstream LiteRT-LM \([^ ]*\) released.*/\1/p')
            [ -z "$ver" ] && continue
            if [ "$(printf '%s\n%s\n' "$ver" "$latest" | sort -V | tail -n1)" = "$latest" ]; then
              echo "Closing superseded issue #$num ($ver < $latest)"
              gh issue close "$num" --comment "Superseded by #$new_num (upstream $latest). Closed automatically by upstream-watch."
            fi
          done
